# Infraestructura local de Valle Design.
#
#   docker compose up -d
#
# - PostgreSQL 16: la base del API (DATABASE_URL en .env.example apunta aquí).
# - MinIO: object storage S3-compatible para los blobs CAD. El adaptador S3
#   EXISTE y se selecciona en runtime (apps/api/src/modules/blob-store,
#   variables S3_BLOB_* de .env.example); sin esas variables los blobs viven
#   en la base (tabla `design_blobs`, adaptador DatabaseBlobStore).
#
# Los puertos se publican SOLO en 127.0.0.1: Docker publica en 0.0.0.0 por
# defecto y salta las reglas de UFW/firewalld escribiendo directo en la
# cadena DOCKER de iptables — en cualquier red compartida eso era un
# PostgreSQL con valle/valle y una consola MinIO expuestos a la LAN.
services:
  postgres:
    image: postgres:16
    container_name: valle-design-postgres
    environment:
      POSTGRES_USER: valle
      POSTGRES_PASSWORD: valle
      POSTGRES_DB: valle_design_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - valle_design_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valle -d valle_design_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Etiqueta fija: `latest` es exactamente lo que validate-dockerfiles.mjs
    # prohíbe en las imágenes propias — la infra local no debería ser menos.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: valle-design-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: valle
      MINIO_ROOT_PASSWORD: valle-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - valle_design_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  valle_design_pgdata:
  valle_design_minio:
