openapi: 3.1.0
info:
  title: Valle Design — API standalone (v1)
  version: 1.0.0
  summary: Contrato v1 de identidad, organizaciones, comercial y CAD de Valle Design.
  description: |
    Contrato FUENTE (SHARED_PROTOCOL) de la API que el producto standalone
    **Valle Design** expone desde el repo `valle-design`. Identidad first-party,
    organizaciones y estado comercial usan `/v1/auth`, `/v1/organizations` y
    `/v1/commercial`; CAD conserva su prefijo canónico `/v1/cad`. La superficie
    CAD reorganiza como recursos de dominio (`cad_projects`, `cad_documents`,
    `cad_document_versions`, `cad_publications`, `cad_review_sessions`,
    `cad_comments`, biblioteca de bloques).

    ## Seguridad
    * Autenticación: cookie de sesión opaca first-party (`sessionCookie`).
      Sin sesión válida ⇒ `401`. Las mutaciones también exigen
      `X-CSRF-Token`, validado contra la cookie legible `valle_csrf`.
      Registro, login, verificación y recuperación declaran `security: []` y
      responden sin enumerar cuentas; los tokens de un solo uso nunca aparecen
      en respuestas normales. La superficie del review link
      (`/v1/cad/review/*`) se autentica con el token server-owned del link
      (`reviewToken`, header `X-Review-Token`) — contexto de SOLO LECTURA
      limitado al documento de la sesión; cualquier otra ruta con ese
      contexto responde `403` con `code: review_read_only` (el read-only lo
      impone el backend, no el frontend).
    * Autorización comercial CAD: el tenant necesita el entitlement
      **`design.cad`** vigente (ver `PRODUCT_CAPABILITY_IDS` en
      `@valle-design/contracts`). El servidor lo verifica en cada endpoint CAD;
      si falta, responde el `403` estándar con `code: entitlement_required`
      (respuesta reutilizable `EntitlementRequired`). Cada operación lo declara
      además con la extensión `x-required-entitlement`.
    * Autorización funcional (RBAC): permisos granulares del producto
      `cad:view | cad:edit | cad:review | cad:publish | cad:admin`, derivados
      server-side de la membresía activa y declarados por operación con
      `x-required-permission`. No se aceptan permisos enviados por el cliente.

    ## Identificadores LEGADOS persistidos (NO renombrar)
    Los documentos del CAD Studio "universal" se persistieron históricamente
    con el modelo centinela **`AXOS-CAD-STUDIO`** y la revisión
    **`UNIVERSAL`** (hoy en `sf_line_layouts.model/revision`, mañana en
    `cad_documents.model/revision`). Este contrato los trata como VALORES
    LEGADOS OPACOS: se siguen leyendo y escribiendo tal cual en los campos
    `model`/`revision` del recurso documento. Renombrarlos exigiría migración
    de datos y un bump de versión del formato del documento; queda fuera de v1
    (candidato a Fase posterior con `meta.schema` nuevo).

    ## Concurrencia (CAS)
    El documento canónico usa concurrencia optimista con un token ENTERO
    monótono: `cadDocumentVersion` (0 = nunca guardado). Toda escritura del
    contenido declara `expectedCadDocumentVersion`; si no coincide con la
    versión persistida el servidor responde `409` con
    `code: cad_document_version_conflict` (y `expected`/`current`). Omitir el
    token es `400 cad_document_version_required`. Los recibos de publicación
    embebidos (`publications`) son server-managed: un escritor debe hacer eco
    EXACTO de lo que leyó o recibe `400 cad_publications_server_managed`.

    ## Transporte
    CORRECCIÓN R3 (decisión de implementación R1, alineada aquí): la API de
    Valle Design responde los cuerpos de éxito TAL CUAL se describen en cada
    operación — SIN el sobre `ApiSuccessEnvelope` de `@valle-design/contracts` (ese
    sobre es del monolito enterprise; el adaptador del editor y el SDK
    consumen los cuerpos directos). Los errores conservan la forma del cuerpo
    estándar de NestJS enriquecido (`statusCode`/`message` + `code`/`details`
    contractuales cuando aplican, más `requestId` de correlación); el catálogo
    de códigos (`cad_document_version_required`,
    `cad_document_version_conflict`, `cad_publications_server_managed`,
    `entitlement_required`, y los de review de Fase 5:
    `review_token_invalid`, `review_token_expired`, `review_token_revoked`,
    `review_session_closed`, `review_read_only`,
    `review_comments_disabled`) es contractual. En el 409 CAS, `expected` y
    `current` viajan en el nivel superior del cuerpo (eco del backend real).

    Estado: **contrato v1 en vigor** — implementado por `apps/api` (R1),
    consumido por el editor (R2) y por el SDK generado
    `packages/design-sdk` (R3); cualquier cambio incompatible es `v2`.
  contact:
    name: Plataforma Valle — separación de productos (Fase 2)
    email: sergiovallezarate@gmail.com
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: https://design.api.interno
    description: >-
      Marcador de posición: el host real del producto Design se define al
      desplegar el repo valle-design. Las rutas ya incluyen su prefijo /v1.
security:
  - sessionCookie: []
tags:
  - name: identity
    description: Identidad first-party, verificacion, recuperacion y sesiones opacas.
  - name: organizations
    description: Organizaciones, membresias e invitaciones del producto standalone.
  - name: commercial
    description: >-
      Estado de suscripcion, entitlements efectivos y catalogo de planes con
      sus precios publicados; sin datos de pago ni secretos.
  - name: legal
    description: >-
      Registro versionado de documentos legales (terminos, aviso de
      privacidad) y registro de aceptacion server-owned, append-only por
      tenant+usuario+documento+version.
  - name: projects
    description: Proyectos CAD (`cad_projects`) — contenedor organizativo de documentos.
  - name: documents
    description: >-
      Documentos CAD (`cad_documents`) — ciclo crear/abrir/guardar con CAS
      optimista sobre el documento canónico (inline o archivo gzip).
  - name: versions
    description: Historial inmutable de versiones CAS (`cad_document_versions`).
  - name: publications
    description: Recibos inmutables de publicación PDF (`cad_publications`).
  - name: reviews
    description: >-
      Sesiones de revisión (`cad_review_sessions`) y comentarios
      (`cad_comments`). Los tokens de review link son server-owned: se
      almacena solo su hash sha256 y el token en claro viaja ÚNICAMENTE en la
      respuesta de creación. Incluye la superficie del canje
      (`/v1/cad/review/*`): contexto de solo lectura autenticado por
      `X-Review-Token`, con expiración y revocación comprobadas server-side
      en cada request.
  - name: sheet-sets
    description: >-
      Conjuntos de planos (`cad_sheet_sets`) — el equivalente del `.dst` de
      AutoCAD. Viven en su PROPIA tabla y no dentro del documento canónico:
      un conjunto agrupa hojas de varios dibujos, así que ninguno de ellos
      puede ser su dueño. Escritura con CAS optimista sobre `version`.
  - name: dxf
    description: Plano DXF de fondo (importar/quitar) y exportación DXF R12 del documento.
  - name: blocks
    description: Biblioteca de bloques CAD reutilizables del tenant (CRUD).
  - name: messaging
    description: >-
      Mensajería de equipo (`/v1/messaging/*`): canales de proyecto —
      visibles a toda la organización— y canales directos entre dos
      personas, mensajes con hilo e insignia de no leídos, y un mensaje
      puede anclarse al dibujo (mismo contrato JSON que `CadComment.anchor`,
      el diferenciador frente a un chat genérico). Reutiliza el entitlement
      `design.cad` y el RBAC `cad:view`/`cad:edit` existentes — no amplía el
      catálogo de permisos. `GET /v1/messaging/events` es un flujo
      `text/event-stream` (SSE) de mensajes nuevos; ver su descripción para
      el límite declarado de una sola instancia de proceso.
  - name: presence
    description: >-
      Presencia EN VIVO por servidor sobre un documento (cursor, encuadre):
      efímera, sin persistencia de historial, sin tocar `cad_document`. Sólo
      sesión first-party (`cad:view`) — la presencia de invitado por review
      link no existe todavía (EventSource no puede mandar `X-Review-Token`).
paths:
  /v1/auth/register:
    post:
      operationId: registerIdentity
      tags: [identity]
      summary: Registra una cuenta sin revelar si ya existia.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Solicitud aceptada; la verificacion viaja solo por correo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/login:
    post:
      operationId: loginIdentity
      tags: [identity]
      summary: Inicia una sesion mediante cookies first-party.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >-
            Sesion creada (el secreto viaja solo en Set-Cookie HttpOnly), o
            desafio de segundo factor cuando la cuenta lo tiene activo. En el
            segundo caso NO se emite cookie: la contrasena sola no abre nada.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/MfaChallengeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/login/mfa:
    post:
      operationId: completeIdentityMfaLogin
      tags: [identity]
      summary: Cierra el desafio de segundo factor y crea la sesion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaLoginRequest" }
      responses:
        "200":
          description: Sesion creada tras validar el codigo.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/session:
    get:
      operationId: getIdentitySession
      tags: [identity]
      summary: Lee la sesion y organizacion activa derivada server-side.
      responses:
        "200":
          description: Contexto first-party vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      operationId: logoutIdentity
      tags: [identity]
      summary: Revoca la sesion actual y limpia sus cookies.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204": { description: Sesion revocada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/sessions:
    get:
      operationId: listIdentitySessions
      tags: [identity]
      summary: Lista como maximo 100 sesiones propias, incluidas las revocadas.
      responses:
        "200":
          description: Sesiones del usuario autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentitySessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/sessions/rotate:
    post:
      operationId: rotateIdentitySession
      tags: [identity]
      summary: Revoca la sesion actual y emite una nueva.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "201":
          description: Sesion rotada; el secreto nuevo viaja en Set-Cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionRotationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/sessions/revoke-all:
    post:
      operationId: revokeOtherIdentitySessions
      tags: [identity]
      summary: Revoca todas las demas sesiones propias.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204": { description: Las demas sesiones quedaron revocadas. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/identitySessionId"
    delete:
      operationId: revokeIdentitySession
      tags: [identity]
      summary: Revoca una sesion propia por UUID.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204": { description: Sesion revocada o ya inactiva. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/mfa:
    get:
      operationId: getIdentityMfaStatus
      tags: [identity]
      summary: Estado del segundo factor de la cuenta autenticada.
      responses:
        "200":
          description: Estado del segundo factor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/mfa/setup:
    post:
      operationId: beginIdentityMfaEnrollment
      tags: [identity]
      summary: Emite un secreto TOTP sin confirmar y su URI para el codigo QR.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "200":
          description: >-
            Secreto y URI otpauth. El factor NO protege nada hasta confirmarlo
            con un codigo; los codigos de respaldo se entregan al activar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaSetupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/mfa/activate:
    post:
      operationId: activateIdentityMfa
      tags: [identity]
      summary: Confirma el alta con un codigo y entrega los codigos de respaldo.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: >-
            Segundo factor activo. Los codigos de respaldo se devuelven UNA sola
            vez: el servidor los guarda en hash y no puede volver a mostrarlos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaActivationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/mfa/disable:
    post:
      operationId: disableIdentityMfa
      tags: [identity]
      summary: Desactiva el segundo factor. Exige la contrasena, no solo la sesion.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmationRequest" }
      responses:
        "200":
          description: Segundo factor desactivado y codigos de respaldo borrados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaDisabledResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/mfa/backup-codes:
    post:
      operationId: regenerateIdentityBackupCodes
      tags: [identity]
      summary: Emite codigos de respaldo nuevos e invalida los anteriores.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmationRequest" }
      responses:
        "200":
          description: Codigos nuevos; los anteriores dejaron de valer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaBackupCodesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/activity:
    get:
      operationId: listIdentityActivity
      tags: [identity]
      summary: Sucesos recientes de identidad de la cuenta autenticada.
      responses:
        "200":
          description: >-
            Hasta 25 sucesos, del mas reciente al mas antiguo. Nunca incluye la
            direccion IP: se persiste para investigar abusos, no para mostrarla
            a quien se siente delante de una sesion abierta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityActivityList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/verify-email:
    post:
      operationId: verifyIdentityEmail
      tags: [identity]
      summary: Consume una vez un token opaco de verificacion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OneTimeTokenRequest" }
      responses:
        "201":
          description: Correo verificado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/verify-email/resend:
    post:
      operationId: resendIdentityVerification
      tags: [identity]
      summary: Solicita verificacion con respuesta no enumerable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          description: Solicitud aceptada exista o no la cuenta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/password/forgot:
    post:
      operationId: requestIdentityPasswordReset
      tags: [identity]
      summary: Solicita recuperacion con respuesta no enumerable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          description: Solicitud aceptada exista o no la cuenta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/password/reset:
    post:
      operationId: resetIdentityPassword
      tags: [identity]
      summary: Cambia la contrasena y revoca las sesiones anteriores.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "201":
          description: Contrasena actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: Lista organizaciones donde el usuario tiene membresia.
      responses:
        "200":
          description: Organizaciones visibles para la sesion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Crea organizacion, membresia owner y trial standalone.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Organizacion creada y activada en la sesion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/active:
    post:
      operationId: activateOrganization
      tags: [organizations]
      summary: Activa una organizacion tras verificar membresia server-side.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveOrganizationRequest" }
      responses:
        "201":
          description: Contexto activo derivado server-side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationContext" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: "#/components/parameters/organizationId"
    get:
      operationId: listOrganizationMemberships
      tags: [organizations]
      summary: Lista hasta 200 miembros de una organizacion visible.
      responses:
        "200":
          description: Membresias y perfiles minimos de colaboracion.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationMembershipList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/organizationId"
    post:
      operationId: createOrganizationInvitation
      tags: [organizations]
      summary: Invita por email sin devolver el token en la respuesta HTTP.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/OrganizationInvitationCreate" }
      responses:
        "201":
          description: Invitacion encolada; el secreto solo viaja por correo.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationInvitationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/organizations/invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags: [organizations]
      summary: Consume una invitacion destinada al correo autenticado.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/OrganizationInvitationAccept" }
      responses:
        "201":
          description: Membresia creada o actualizada.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationInvitationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/commercial/subscription:
    get:
      operationId: getActiveSubscription
      tags: [commercial]
      summary: Lee la suscripcion de la organizacion activa server-side.
      responses:
        "200":
          description: Estado sin precios, datos de pago ni secretos.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CommercialSubscriptionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/commercial/entitlements:
    get:
      operationId: listEffectiveEntitlements
      tags: [commercial]
      summary: Lista entitlements efectivos de la organizacion activa.
      responses:
        "200":
          description: Lista vacia cuando no hay plan vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveEntitlementList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/commercial/plans:
    get:
      operationId: listCommercialPlans
      tags: [commercial]
      summary: Publica el catalogo activo de planes con sus precios activos.
      description: >-
        Catalogo GLOBAL del producto (no contiene datos por organizacion, asi
        que basta una sesion autenticada, incluso sin organizacion activa):
        planes activos con sus entitlements y sus precios activos por moneda y
        periodo. `checkout` se deriva del proveedor de pagos configurado;
        `external` significa que el cobro ocurre fuera del producto y se
        registra via upgrade-intents.
      responses:
        "200":
          description: >-
            Catalogo publicado; un plan sin precio publicado lista `prices`
            vacio (no desaparece).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialPlanList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/commercial/public/plans:
    get:
      operationId: listPublicCommercialPlans
      tags: [commercial]
      summary: Publica el catalogo comercial para visitantes sin sesion.
      description: >-
        Misma configuracion GLOBAL que `/v1/commercial/plans` (ningun dato por
        organizacion) servida SIN sesion: la pagina de precios es la puerta de
        entrada del embudo y exigir una cuenta para decir cuanto cuesta el
        producto mata la conversion. Publica solo los planes que el operador
        marco como publicables (`metadata.public`); un plan de pago sin precio
        activo se OMITE en vez de salir sin importe, porque publicar un plan
        sin precio es publicar una duda. La respuesta es cacheable: es
        identica para todos los visitantes.
      security: []
      parameters:
        - name: currency
          in: query
          required: false
          description: >-
            Filtra los precios a UNA moneda ISO-4217. La pagina de precios
            de un pais no debe mezclar monedas: sin filtro se publican todas
            las activas y el visitante tendria que adivinar cual le aplica.
            Un plan de pago que no tenga precio en la moneda pedida se omite,
            igual que si no tuviera precio.
          schema: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "200":
          description: >-
            Planes publicables con sus precios activos, ordenados por codigo.
            Lista vacia si el operador todavia no publico ninguno.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PublicCommercialPlanList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/commercial/public/tax-catalogs:
    get:
      operationId: listSatTaxCatalogs
      tags: [commercial]
      summary: Publica los catalogos del SAT que la captura fiscal necesita.
      description: >-
        `c_RegimenFiscal` completo y el subconjunto de `c_UsoCFDI` aplicable a
        una suscripcion de software. Es informacion PUBLICA del SAT, identica
        para todo Mexico y sin un solo dato de ninguna organizacion, asi que se
        sirve sin sesion y cacheada: el formulario fiscal aparece en el alta,
        antes de que exista organizacion activa. Regimen y uso son catalogos
        CERRADOS; el producto no acepta texto libre en ninguno de los dos.
      security: []
      responses:
        "200":
          description: Catalogos vigentes, servidos desde constantes del producto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatTaxCatalogs" }
  /v1/commercial/tax-profile:
    get:
      operationId: getOrganizationTaxProfile
      tags: [commercial]
      summary: Lee los datos fiscales CFDI 4.0 de la organizacion (owner/admin).
      responses:
        "200":
          description: >-
            Perfil capturado, o `null` si todavia no lo hay. `issuance` dice
            como se emite el CFDI hoy y nunca promete mas de lo que hace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: saveOrganizationTaxProfile
      tags: [commercial]
      summary: Captura o sustituye los datos fiscales para el CFDI 4.0.
      description: >-
        Los cinco campos viajan JUNTOS porque juntos se validan: el tipo de
        persona sale de la longitud del RFC, el regimen solo es legal para
        cierto tipo de persona y el uso de CFDI solo lo es para ciertos
        regimenes. La validacion es de FORMA y de CATALOGO; el producto NO
        consulta al SAT y no afirma que el RFC exista. Fallo cerrado: o se
        guarda el perfil entero o no se guarda nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxProfileSave" }
      responses:
        "200":
          description: Perfil guardado; sustituye al anterior si lo habia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfileResponse" }
        "400":
          description: >-
            Datos que el SAT rechazaria (`tax_profile_invalid`). El cuerpo
            lista TODOS los campos mal, no solo el primero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfileInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/commercial/upgrade-intents:
    get:
      operationId: listUpgradeIntents
      tags: [commercial]
      summary: Lista intents de upgrade de la organizacion activa (owner/admin).
      responses:
        "200":
          description: Intents del mas reciente al mas antiguo, sin correos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeIntentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUpgradeIntent
      tags: [commercial]
      summary: Registra un intent de upgrade auditable (checkout sin pasarela).
      description: >-
        Sin pasarela de pagos el producto no cobra; deja constancia durable de
        quien pidio pasar a que plan. El intent queda `pending` hasta que un
        owner/admin lo confirme (tras el cobro externo) o lo cancele. A lo
        sumo un `pending` por organizacion (indice unico parcial).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeIntentCreate" }
      responses:
        "201":
          description: Intent registrado en estado `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeIntentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            Ya existe un intent `pending` (`upgrade_intent_pending`) o el plan
            pedido ya esta activo (`plan_already_active`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/upgrade-intents/{intentId}/confirm:
    post:
      operationId: confirmUpgradeIntent
      tags: [commercial]
      deprecated: true
      summary: "RETIRADO (P0-A): ningun principal de organizacion cliente puede confirmar su propio upgrade."
      description: >-
        Antes activaba la suscripcion sin pasar por un proveedor de pago
        verificado. `organizationId` siempre se deriva de la membresia activa
        de quien llama (ADR-0005), asi que el unico principal alcanzable era
        el owner/admin de la MISMA organizacion que pidio el upgrade -
        exactamente el actor que nunca debe poder concederse a si mismo un
        plan pagado. La ruta sigue existiendo (no se retira el path) pero
        cualquier llamada autenticada recibe 403 sin mutar nada; la
        activacion real llega por el webhook firmado del proveedor de pagos
        (ADR-0006, ver `POST /v1/commercial/webhooks/stripe`).
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Confirmacion manual retirada (`assisted_checkout_confirmation_retired`),
            o el llamante no es owner/admin de una organizacion activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/upgrade-intents/{intentId}/cancel:
    post:
      operationId: cancelUpgradeIntent
      tags: [commercial]
      summary: Cancela un intent pendiente (solo owner/admin).
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Intent cancelado; la fila persiste como auditoria.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeIntentView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El intent ya fue decidido (`upgrade_intent_not_pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/checkout-sessions:
    post:
      operationId: createCommercialCheckoutSession
      tags: [commercial]
      summary: Abre una compra autoservicio (owner/admin) y devuelve la URL hospedada.
      description: >-
        Registra el intent auditable (a lo sumo uno `pending` por
        organizacion; un `pending` del MISMO plan se reutiliza) y pide al
        proveedor una sesion de pago hospedada. El precio sale de
        `plan_prices`, nunca del cliente. Con el proveedor nulo la ruta
        responde 409 `checkout_unavailable` con el intent ya registrado: el
        cobro de ese despliegue es externo/asistido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CommercialCheckoutSessionCreate" }
      responses:
        "201":
          description: Sesion abierta; `url` es la pagina de pago del proveedor.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CommercialCheckoutSession" }
        "400":
          description: >-
            Plan no vendible (`plan_unavailable`), sin precio publicado para
            esa moneda y periodo (`price_unavailable`), asientos por debajo del
            minimo del plan (`seats_below_minimum`) o asientos en un plan que
            no cobra por usuario (`seats_not_applicable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            No hay pasarela configurada (`checkout_unavailable`), ya existe un
            `pending` de otro plan (`upgrade_intent_pending`) o el plan ya
            esta activo (`plan_already_active`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/invoices:
    get:
      operationId: listCommercialInvoices
      tags: [commercial]
      summary: Lista el historial de facturas de la organizacion (owner/admin).
      description: >-
        Espejo local de las facturas del proveedor, de la mas reciente a la
        mas antigua. El documento fiscal sigue siendo del proveedor:
        `hostedUrl` apunta a el. Nunca incluye datos de pago.
      responses:
        "200":
          description: Facturas de la organizacion activa; vacio si no hubo cobros.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialInvoiceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/commercial/subscription/cancel:
    post:
      operationId: cancelCommercialSubscription
      tags: [commercial]
      summary: Cancela la suscripcion a fin de periodo (solo owner).
      description: >-
        No corta el acceso: lo comprado sigue vigente hasta
        `currentPeriodEnd`, y el estado `cancelled` lo aplica el webhook del
        proveedor cuando el periodo expira. Con el proveedor nulo la solicitud
        queda registrada como evento de dominio para el operador
        (`kind: recorded`).
      responses:
        "200":
          description: Baja programada (`scheduled`) o registrada (`recorded`).
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CommercialSubscriptionCancellation",
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La suscripcion ya estaba cancelada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/billing-portal-sessions:
    post:
      operationId: createProviderBillingPortalSession
      tags: [commercial]
      summary: Abre el portal del proveedor para arreglar el medio de pago.
      description: >-
        Un cliente en `past_due` podia enterarse de que su cobro fallo pero no
        arreglarlo desde el producto. Los datos de la tarjeta no pasan por
        aqui, asi que la unica salida honesta es una sesion del portal del
        proveedor, que es quien los custodia. La URL es de UN cliente y caduca
        sola: no se cachea ni se guarda.
      responses:
        "200":
          description: Sesion del portal abierta; `url` caduca en minutos.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CommercialBillingPortalSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            No hay pasarela configurada o la organizacion no tiene cliente en
            ella (`billing_portal_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/cfdi:
    get:
      operationId: listCommercialCfdiReceipts
      tags: [commercial]
      summary: Lista los CFDI de cada cobro de la organizacion (owner/admin).
      description: >-
        El rastro fiscal, separado del espejo de facturas del proveedor de
        pagos: que comprobante cubre cada cobro y en que estado esta
        (timbrado, en emision manual, en el pool de la factura global, o
        rechazado por el PAC). `issuance` repite el descriptor del proveedor
        para que la interfaz no prometa timbrado donde no lo hay.
      responses:
        "200":
          description: Recibos CFDI de la organizacion activa, recientes primero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialCfdiReceiptList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/commercial/cfdi/{receiptId}/files/{format}:
    get:
      operationId: downloadCommercialCfdiFile
      tags: [commercial]
      summary: Descarga el XML o PDF de un CFDI timbrado (owner/admin).
      description: >-
        El archivo lo custodia el PAC y exige la credencial de la cuenta
        emisora, que jamas viaja al navegador: el producto lo descarga
        autenticado y lo sirve. Solo comprobantes `issued` tienen archivos.
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: path
          required: true
          schema: { type: string, enum: [pdf, xml] }
      responses:
        "200":
          description: El comprobante, como adjunto.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Aun no esta timbrado, o el proveedor configurado no ofrece
            descarga (`cfdi_files_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/commercial/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [commercial]
      summary: Recibe eventos firmados de la pasarela (ruta publica).
      description: >-
        Publica porque el emisor es la pasarela, que no tiene sesion: su
        credencial es la firma HMAC-SHA256 sobre los BYTES CRUDOS, con
        tolerancia de tiempo. Idempotente por `event.id`; el efecto y su
        asiento comparten transaccion. Un tipo no modelado responde 200 y
        queda registrado — jamas un 500.
      security: []
      requestBody:
        required: true
        description: Evento del proveedor, tal cual, sin reserializar.
        content:
          application/json:
            schema:
              type: object
              description: Evento opaco del proveedor; se verifica por firma.
      responses:
        "200":
          description: Procesado, duplicado o registrado sin efecto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripeWebhookAccepted" }
        "400":
          description: >-
            Firma ausente, invalida o fuera de tolerancia, o cuerpo no
            verificable (`invalid_signature`, `raw_body_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: >-
            Evento legitimo que aun no se puede atribuir a una organizacion
            (`event_not_correlated`); el proveedor debe reintentar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: >-
            El despliegue no tiene pasarela configurada
            (`payment_provider_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/legal/documents:
    get:
      operationId: listLegalDocuments
      tags: [legal]
      summary: Publica el registro versionado de terminos y aviso de privacidad.
      description: >-
        Publica porque el web necesita saber que version mostrar antes de que
        exista sesion (por ejemplo, en el registro). La version vive en el
        API y no en el web: es quien registra la aceptacion, y un registro
        contra una version que solo conoce el cliente no acredita nada.
      security: []
      responses:
        "200":
          description: Documentos vigentes (`terms` y `privacy`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalDocumentList" }
  /v1/legal/acceptances:
    get:
      operationId: listLegalAcceptances
      tags: [legal]
      summary: Lista las aceptaciones registradas del usuario en la organizacion activa.
      responses:
        "200":
          description: >-
            Aceptaciones de la organizacion activa, de la mas reciente a la
            mas antigua.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAcceptanceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: acceptLegalDocument
      tags: [legal]
      summary: Registra la aceptacion de una version EXACTA de un documento legal.
      description: >-
        El actor, el tenant y el instante salen de la sesion verificada,
        nunca del cuerpo de la peticion. Aceptar dos veces la MISMA version es
        idempotente (indice unico tenant+usuario+documento+version). Una
        version desconocida es 400: senal de que el cliente esta
        desactualizado, no de que el usuario haya aceptado algo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalAcceptanceCreate" }
      responses:
        "201":
          description: Aceptacion registrada (o ya existia con la misma version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAcceptanceConfirmed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/cad/projects:
    get:
      operationId: listCadProjects
      tags: [projects]
      summary: Lista proyectos CAD del tenant.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - name: status
          in: query
          description: Filtra por ciclo de vida del proyecto.
          schema:
            type: string
            enum: [active, archived]
        - $ref: "#/components/parameters/searchQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Página de proyectos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CadProject"
                  total:
                    type: integer
                    minimum: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
    post:
      operationId: createCadProject
      tags: [projects]
      summary: Crea un proyecto CAD.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadProjectCreate"
      responses:
        "201":
          description: Proyecto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadProject"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
  /v1/cad/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getCadProject
      tags: [projects]
      summary: Detalle de un proyecto CAD.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Proyecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadProject"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCadProject
      tags: [projects]
      summary: Actualiza nombre/descripción/estado de un proyecto CAD.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadProjectUpdate"
      responses:
        "200":
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadProject"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveCadProject
      tags: [projects]
      summary: Archiva un proyecto CAD (borrado suave).
      description: >-
        v1 NO ofrece borrado físico: `DELETE` lleva el proyecto a
        `status: archived` conservando documentos e historial. Decisión
        deliberada: los documentos CAD son registro de ingeniería.
      x-required-entitlement: design.cad
      x-required-permission: cad:admin
      responses:
        "200":
          description: Proyecto archivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadProject"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/support/incidents:
    post:
      operationId: reportSupportIncident
      tags: [support]
      summary: Reporta un problema desde el estudio, con su diagnostico.
      description: >
        El boton «algo salio mal» del estudio. Viaja SIEMPRE version, navegador y
        comando en curso; el identificador del documento viaja SOLO si la persona
        lo autoriza explicitamente, y nunca su contenido. Se entrega por el outbox
        transaccional, con la misma idempotencia que el resto del correo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportIncidentRequest" }
      responses:
        "202":
          description: Reporte aceptado y encolado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/feedback:
    post:
      operationId: createProductFeedback
      tags: [support]
      summary: Envia un comentario sobre el producto y lo GUARDA con estado.
      description: >
        El centro de comentarios. A diferencia de `/v1/support/incidents` —que
        manda un correo y se olvida— esto persiste: el comentario tiene estado y
        su autor lo ve en `/v1/feedback/mine`. El contexto tecnico es opcional,
        viaja solo con permiso explicito y el servidor lo recorta a cinco campos
        declarados; nunca contiene el dibujo. Permiso `cad:view`, el mas bajo:
        quien esta en solo-lectura tras vencer su periodo es justo quien mas
        necesita poder decir que algo no funciona.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "201":
          description: Comentario guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: listAllProductFeedback
      tags: [support]
      summary: Todos los comentarios, de todas las organizaciones.
      description: >
        La materia prima del backlog. Cruza la frontera de inquilino que el
        resto del producto respeta a rajatabla, y por eso su puerta es la mas
        estrecha que existe aqui: solo los correos declarados en
        `PRODUCT_OPERATOR_EMAILS`, que es configuracion del despliegue y no un
        rol de la base de datos. Sin esa variable no hay operadores y devuelve
        403 a todo el mundo.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [nuevo, leido, planeado, resuelto]
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [falla, sugerencia, duda]
      responses:
        "200":
          description: Comentarios de todos los inquilinos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackAdminList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/feedback/mine:
    get:
      operationId: listMyProductFeedback
      tags: [support]
      summary: Los comentarios propios, con su estado visible.
      description: >
        La vuelta del canal. Saber que alguien leyo lo que escribiste es la mitad
        de lo que pides cuando te tomas la molestia de escribir; un canal sin esa
        mitad se queda vacio solo.
      responses:
        "200":
          description: Comentarios del usuario autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/feedback/{feedbackId}:
    parameters:
      - name: feedbackId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateProductFeedbackStatus
      tags: [support]
      summary: Cambia el estado de un comentario. Solo operadores del producto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackStatusRequest" }
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/calls/rooms:
    post:
      operationId: joinCallRoom
      tags: [calls]
      summary: Crea o se une a la sala de llamada de un documento.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      description: >
        Idempotente por (tenant, documentId): si ya hay una sala abierta para
        ese documento la reutiliza y añade un participante nuevo; si no,
        abre una. La sala, sus participantes y las señales SDP/ICE viven en
        memoria del proceso, nunca en disco — una llamada dura minutos, no
        meses. La malla completa (cada participante conectado a todos los
        demás) topa en cuatro; un quinto responde 409. `iceServers` trae el
        STUN/TURN que este despliegue tenga configurado y `turnConfigured`
        dice si hay TURN real detrás — sin él, las llamadas entre redes que
        no atraviesan NAT directo (del orden del 15%) fallan, y el cliente
        debe decirlo en vez de quedarse "conectando" para siempre.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallJoinRequest" }
      responses:
        "201":
          description: Sala (nueva o reutilizada) con el roster y la configuración ICE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallJoinResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La sala ya tiene el tope de participantes de la malla completa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/calls/rooms/{roomId}/leave:
    parameters:
      - name: roomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: leaveCallRoom
      tags: [calls]
      summary: Sale de la sala. Si era el último participante, la sala termina.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallLeaveRequest" }
      responses:
        "200":
          description: Fuera de la sala.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [left]
                properties:
                  left: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/calls/rooms/{roomId}/signals:
    parameters:
      - name: roomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: postCallSignal
      tags: [calls]
      summary: Envía una oferta, respuesta o candidato ICE a otro participante.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      description: >
        El servidor enruta el mensaje sin interpretarlo: `payload` es
        exactamente lo que produce `RTCPeerConnection` en el navegador
        (`RTCSessionDescriptionInit` para oferta/respuesta,
        `RTCIceCandidateInit` para un candidato). Si el destinatario tiene
        `GET .../events` abierto se entrega de inmediato; si no, se guarda en
        su buzón hasta que conecte o hasta que expire el TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallSignalRequest" }
      responses:
        "202":
          description: Señal encolada para su entrega.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queued]
                properties:
                  queued: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/calls/rooms/{roomId}/events:
    parameters:
      - name: roomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: streamCallRoomEvents
      tags: [calls]
      summary: Entrega en vivo (SSE) del roster y las señales del participante.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      description: >
        `Server-Sent Events`, no WebSocket. `EventSource` no manda headers
        propios: la sesión viaja por la cookie de siempre (mismo origen) y
        `participantId` va en la query, validado contra la sala y el tenant
        del actor antes de abrir el stream. Manda un evento `roster` al
        conectar y en cada cambio de participantes, un evento `signal` por
        cada mensaje dirigido a este participante (incluidos los que
        llegaron mientras no había conexión abierta), y un `ping` periódico
        para que el stream no parezca muerto detrás de un proxy con timeout
        de idle.
      parameters:
        - name: participantId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stream `text/event-stream` de eventos de la sala.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/CallServerEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents:
    get:
      operationId: listCadDocuments
      tags: [documents]
      summary: Lista documentos CAD del tenant.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - name: projectId
          in: query
          description: Filtra por proyecto contenedor.
          schema:
            $ref: "#/components/schemas/CadProjectId"
        - name: model
          in: query
          description: Coincidencia exacta del alias legacy persistido.
          schema:
            $ref: "#/components/schemas/LegacyModelAlias"
        - name: revision
          in: query
          description: Coincidencia exacta de la revisión legacy persistida.
          schema:
            $ref: "#/components/schemas/LegacyRevisionAlias"
        - $ref: "#/components/parameters/searchQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Página de documentos (metadatos, SIN el documento canónico).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CadDocumentSummary"
                  total:
                    type: integer
                    minimum: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
    post:
      operationId: createCadDocument
      tags: [documents]
      summary: Crea un documento CAD (metadatos; contenido con versión CAS 0).
      description: >-
        Crea la fila contenedora con `cadDocumentVersion: 0`. El contenido se
        guarda después con `PUT /v1/cad/documents/{documentId}/content` (o
        `/archive`) declarando `expectedCadDocumentVersion: 0` en la primera
        escritura. Emite el evento `design.document.created.v1`.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadDocumentCreate"
      responses:
        "201":
          description: Documento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
  /v1/cad/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      operationId: openCadDocument
      tags: [documents]
      summary: Abre un documento CAD (metadatos + documento canónico HIDRATADO + token CAS).
      description: >-
        Devuelve el documento canónico junto con `cadDocumentVersion`, el
        token de concurrencia que el cliente debe declarar en el siguiente
        guardado.


        HIDRATACIÓN (aditivo, R3): el servidor SIEMPRE responde el documento
        completo (`CadDocumentInline`). Un documento grande (>1 000 000 bytes)
        se PERSISTE como archivo gzip en el blob store con puntero `_storage`
        (`CadDocumentBlobPointer`), pero ese puntero es un detalle de
        almacenamiento: al abrir, el servidor lo rehidrata desde el blob y
        entrega el JSON inline — la misma semántica del flujo legacy
        (`getLayout` con `includeCadDocument=true`), que es la que el editor
        espera. El puntero solo es observable de forma indirecta vía
        `storedAsBlobPointer` en `CadDocumentSaveResult`. Si el blob no puede
        recuperarse, el servidor responde `503` (nunca un documento parcial ni
        el puntero crudo).
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Documento abierto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentResource"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCadDocumentMeta
      tags: [documents]
      summary: Actualiza metadatos del documento (nombre, proyecto, capas).
      description: >-
        NO toca el documento canónico ni su token CAS. `model`/`revision` son
        de solo lectura en v1 (alias legados persistidos).
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadDocumentMetaUpdate"
      responses:
        "200":
          description: Metadatos actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveCadDocument
      tags: [documents]
      summary: Archiva un documento CAD (borrado suave).
      description: >-
        Conserva historial, publicaciones y comentarios. Emite el evento
        `design.document.archived.v1`. Sin borrado físico en v1.
      x-required-entitlement: design.cad
      x-required-permission: cad:admin
      responses:
        "204":
          description: Documento archivado.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/provisional:
    delete:
      operationId: discardProvisionalCadDocument
      tags: [documents]
      summary: Descarta un documento provisional propio tras fallar una importación.
      description: >-
        Rollback acotado para editores: sólo archiva la fila vacía creada por
        el mismo actor dentro del tenant activo, con
        `cadDocumentVersion = 0`, documento canónico nulo y sin fondo DXF. El
        predicado se valida de forma atómica para no descartar contenido que se
        guarde concurrentemente. No concede ni sustituye el borrado
        administrativo general de `DELETE /v1/cad/documents/{documentId}`.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "204":
          description: Documento provisional descartado.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El documento ya contiene información o dejó de ser provisional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/cad/documents/{documentId}/content:
    put:
      operationId: saveCadDocumentContent
      tags: [documents]
      summary: Guarda el documento canónico (JSON inline) mediante CAS optimista.
      description: |
        Rama inline del guardado: el documento viaja como JSON en el cuerpo
        (límite **8 000 000 bytes** serializado). Para documentos mayores usar
        `PUT /v1/cad/documents/{documentId}/archive` (gzip multipart).

        Reglas CAS (semántica real del backend):
        * `expectedCadDocumentVersion` es OBLIGATORIO; omitirlo ⇒
          `400 cad_document_version_required`.
        * Si no coincide con la versión persistida ⇒
          `409 cad_document_version_conflict` con `expected`/`current`.
        * Primera escritura sobre un documento recién creado ⇒
          `expectedCadDocumentVersion: 0`.
        * `publications` es server-managed: eco exacto de lo leído o
          `400 cad_publications_server_managed`.

        Al persistir, el servidor decide el almacenamiento: inline si el JSON
        es compacto (≤ 1 000 000 bytes) o archivo gzip en blob store con
        puntero `_storage` si no. Cada guardado exitoso incrementa
        `cadDocumentVersion` en 1 y agrega la fila correspondiente al
        historial (`cad_document_versions`).
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      parameters:
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cadDocument, expectedCadDocumentVersion]
              properties:
                cadDocument:
                  $ref: "#/components/schemas/CadDocumentInline"
                expectedCadDocumentVersion:
                  $ref: "#/components/schemas/CadDocumentVersionToken"
      responses:
        "200":
          description: Documento guardado; nueva versión CAS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentSaveResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /v1/cad/documents/{documentId}/archive:
    put:
      operationId: saveCadDocumentArchive
      tags: [documents]
      summary: Guarda el documento canónico grande como archivo gzip (multipart) mediante CAS.
      description: |
        Rama de archivo del guardado — espejo del actual
        `PUT /line-engineering/layout/cad-archive`:
        * `multipart/form-data` con **exactamente un archivo** en el campo
          `file`: el documento canónico serializado JSON y comprimido gzip.
        * Límites reales: gzip ≤ **20 MiB** (20 971 520 bytes); JSON
          descomprimido ≤ **32 MiB**; máximo 4 campos de formulario; cada
          campo de texto ≤ 8 000 000 bytes.
        * El campo `payload` es un string JSON con el token CAS
          (`expectedCadDocumentVersion`). DIFERENCIA DELIBERADA con el legacy:
          allí el campo se llama `layout` y arrastra el DTO industrial
          completo (model/revision/posiciones); en v1 el documento es el
          recurso y solo viaja el token.

        Mismas reglas CAS y de `publications` que la rama inline.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      parameters:
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, payload]
              properties:
                file:
                  type: string
                  contentMediaType: application/gzip
                  description: >-
                    Documento canónico JSON comprimido con gzip. Máximo
                    20 971 520 bytes comprimidos; 33 554 432 bytes al
                    descomprimir.
                payload:
                  type: string
                  description: >-
                    String JSON `{"expectedCadDocumentVersion": <entero>=0>}`.
                    Obligatorio; sin él ⇒ 400 cad_document_version_required.
            encoding:
              file:
                contentType: application/gzip
      responses:
        "200":
          description: Documento guardado; nueva versión CAS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentSaveResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413":
          description: El archivo gzip excede 20 MiB (o el JSON descomprimido excede 32 MiB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/cad/documents/{documentId}/versions:
    get:
      operationId: listCadDocumentVersions
      tags: [versions]
      summary: Lista el historial de versiones CAS del documento (más reciente primero).
      description: >-
        Una fila por versión CAS persistida (`cad_document_versions`), sin el
        payload: solo versión, hash y auditoría. El payload se obtiene por
        versión individual.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/documentId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Historial de versiones.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CadDocumentVersionSummary"
                  total:
                    type: integer
                    minimum: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/versions/{version}:
    get:
      operationId: getCadDocumentVersion
      tags: [versions]
      summary: Obtiene una versión CAS concreta con su documento canónico.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/documentId"
        - name: version
          in: path
          required: true
          description: Versión CAS entera (≥ 1).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Versión con su payload tal como vivía (inline o puntero a blob).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadDocumentVersionDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/publications:
    get:
      operationId: listCadPublications
      tags: [publications]
      summary: Lista los recibos de publicación del documento.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200":
          description: Recibos de publicación (inmutables), más reciente primero.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/CadPublicationReceipt"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: recordCadPublication
      tags: [publications]
      summary: Registra el recibo de una publicación PDF generada por el cliente (CAS).
      description: |
        El PDF multi-hoja se genera en el cliente; el servidor registra el
        RECIBO auditable: nombre de archivo, `sha256`, tamaño en bytes y las
        hojas (`paperSpaceIds`) incluidas. Semántica real:
        * CAS: `expectedCadDocumentVersion` obligatorio; desfasado ⇒ `409`.
        * Las hojas deben existir en el documento, sin duplicados y sin
          incluir hojas con `includeInPublish: false` ⇒ si no, `400`.
        * Efecto: incrementa `meta.version` del contenido, anexa entrada de
          historial y el recibo a `publications` (embebido, server-managed) y
          crea la fila `cad_publications`. Emite
          `design.document.published.v1`.
        * Este endpoint es la ÚNICA vía para crear recibos; un guardado normal
          que intente mutarlos recibe `400 cad_publications_server_managed`.
      x-required-entitlement: design.cad
      x-required-permission: cad:publish
      parameters:
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadPublicationCreate"
      responses:
        "201":
          description: Recibo registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadPublicationReceipt"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /v1/cad/sheet-sets:
