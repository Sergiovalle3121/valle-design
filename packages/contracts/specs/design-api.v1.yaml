  /v1/cad/documents/{documentId}/review-sessions:
    get:
      operationId: listCadReviewSessions
      tags: [reviews]
      summary: Lista sesiones de revisión del documento.
      description: >-
        NUNCA expone tokens ni hashes de review link: solo el booleano
        `hasShareLink`.
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/documentId"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Sesiones de revisión.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CadReviewSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCadReviewSession
      tags: [reviews]
      summary: Abre una sesión de revisión (opcionalmente con review link de solo lectura).
      description: |
        Tokens server-owned: si `shareLink: true`, el servidor GENERA el token
        (16–256 caracteres, aleatoriedad criptográfica), persiste únicamente
        su hash sha256 (`token_hash`) y devuelve el token en claro **solo en
        esta respuesta** (`shareToken`). No existe ningún otro endpoint que lo
        devuelva; perderlo obliga a abrir otra sesión o rotar el link. Los
        review links son SIEMPRE de solo lectura (`readOnly: true`); si la
        sesión lo permite (`allowComments`, default true), el contexto de
        review puede además crear/listar/resolver comentarios del hilo de SU
        sesión. La expiración (`expiresAt`) la calcula el SERVIDOR: TTL
        pedido (`shareLinkTtlMinutes`, acotado 5 min–90 días) o el default
        del despliegue (7 días), y se comprueba server-side en cada canje.
        Máximo 20 sesiones abiertas por documento.
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shareLink:
                  type: boolean
                  default: false
                  description: Genera un review link de solo lectura para la sesión.
                allowComments:
                  type: boolean
                  default: true
                  description: >-
                    ¿El contexto de review puede crear/resolver comentarios?
                    El dibujo es de solo lectura en cualquier caso.
                shareLinkTtlMinutes:
                  type: integer
                  minimum: 5
                  maximum: 129600
                  description: >-
                    Vigencia del link en minutos (solo con `shareLink: true`).
                    Omitido = default del despliegue (7 días). El servidor
                    acota el valor y siempre fija `expiresAt` él mismo.
      responses:
        "201":
          description: Sesión creada (única aparición del token en claro).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadReviewSessionCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/review-sessions/{sessionId}/close:
    post:
      operationId: closeCadReviewSession
      tags: [reviews]
      summary: Cierra una sesión de revisión (revoca su review link de inmediato).
      description: >-
        Estampa `closedAt` y, si la sesión tenía link, `revokedAt`: el token
        muere DE INMEDIATO — el canje re-valida contra la fila en cada
        request, no existe credencial derivada que sobreviva a la revocación.
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadReviewSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "La sesión ya estaba cerrada (`code: review_session_closed`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/cad/documents/{documentId}/comments:
    get:
      operationId: listCadComments
      tags: [reviews]
      summary: Lista comentarios del documento (directos o de una sesión).
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/documentId"
        - name: reviewSessionId
          in: query
          description: Filtra por sesión de revisión.
          schema:
            $ref: "#/components/schemas/CadReviewSessionId"
        - name: resolved
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Comentarios.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: "#/components/schemas/CadComment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCadComment
      tags: [reviews]
      summary: Crea un comentario sobre el documento (con ancla opcional en el dibujo).
      description: >-
        `reviewSessionId` nulo/omitido = comentario directo sobre el
        documento. Límite real del cuerpo: 1–1000 caracteres, no vacío tras
        trim. Máximo 500 hilos de revisión por documento. Comentar en una
        sesión CERRADA es `400` con `code: review_session_closed`.
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadCommentCreate"
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadComment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/comments/{commentId}/resolve:
    post:
      operationId: resolveCadComment
      tags: [reviews]
      summary: Marca un comentario como resuelto.
      x-required-entitlement: design.cad
      x-required-permission: cad:review
      parameters:
        - $ref: "#/components/parameters/commentId"
      responses:
        "200":
          description: Comentario resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadComment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/review/context:
    get:
      operationId: redeemReviewLinkContext
      tags: [reviews]
      summary: "Canje del review link: contexto de solo lectura limitado al documento."
      description: |
        ÚNICA superficie alcanzable con el token del review link (header
        `X-Review-Token`; sin cookie de sesión). El servidor valida hash + expiración +
        revocación EN CADA request y responde el documento canónico HIDRATADO
        de la sesión (misma semántica de apertura del autor, proyección
        REDUCIDA — sin metadatos internos), la colocación del DXF de fondo y
        la sesión (jamás el token ni su hash). El canje queda AUDITADO
        server-side sin registrar el token. Con este contexto, cualquier otra
        ruta de la API — mutación o lectura — responde `403` con
        `code: review_read_only`: el read-only lo impone el backend.
        Token desconocido/malformado ⇒ `401 review_token_invalid`; expirado ⇒
        `401 review_token_expired`; revocado o sesión cerrada ⇒
        `401 review_token_revoked`.
      security:
        - reviewToken: []
      responses:
        "200":
          description: Contexto de solo lectura del review link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewLinkContext"
        "401": { $ref: "#/components/responses/ReviewTokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/review/comments:
    get:
      operationId: listReviewLinkComments
      tags: [reviews]
      summary: Hilo de comentarios de la sesión del review link.
      description: >-
        Solo el hilo de LA sesión canjeada: los comentarios internos del
        documento (directos o de otras sesiones) no se exponen al invitado.
      security:
        - reviewToken: []
      responses:
        "200":
          description: Comentarios de la sesión.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: "#/components/schemas/CadComment"
        "401": { $ref: "#/components/responses/ReviewTokenRejected" }
    post:
      operationId: createReviewLinkComment
      tags: [reviews]
      summary: Crea un comentario en la sesión del review link (si lo permite).
      description: >-
        Disponible solo si la sesión se creó con `allowComments` (default
        true); si no, `403` con `code: review_comments_disabled`. La sesión y
        el documento los fija el TOKEN (el cliente no elige ids). El autor
        del asiento es la identidad sintética `review-link:<sessionId>`.
      security:
        - reviewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                anchor:
                  type: ["object", "null"]
                  description: Ancla en el dibujo (JSON libre). Null = sin ancla.
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadComment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/ReviewTokenRejected" }
        "403":
          description: "La sesión no admite comentarios (`code: review_comments_disabled`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/cad/review/comments/{commentId}/resolve:
    post:
      operationId: resolveReviewLinkComment
      tags: [reviews]
      summary: Resuelve un comentario del hilo de la sesión del review link.
      description: >-
        Solo comentarios del hilo de LA sesión canjeada (cualquier otro id es
        `404`). Requiere `allowComments`; resolver dos veces es idempotente.
      security:
        - reviewToken: []
      parameters:
        - $ref: "#/components/parameters/commentId"
      responses:
        "200":
          description: Comentario resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadComment"
        "401": { $ref: "#/components/responses/ReviewTokenRejected" }
        "403":
          description: "La sesión no admite comentarios (`code: review_comments_disabled`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/presence:
    parameters:
      - $ref: "#/components/parameters/documentId"
    post:
      operationId: publishCadPresenceBeat
      tags: [presence]
      summary: Publica un latido de presencia (cursor/encuadre) sobre el documento.
      description: >-
        Efímero: sobrescribe la última posición conocida de ESTA pestaña
        (`peerId`) sobre este documento; no crea historial. `name` sale del
        email de la sesión autenticada, nunca del cuerpo. Sin latido nuevo
        antes de 12 s, el peer caduca del lado de quien escucha (TTL local,
        igual que el transporte entre pestañas del mismo navegador).
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadPresenceBeatCreate"
      responses:
        "204":
          description: Latido aplicado.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/presence/stream:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      operationId: streamCadPresence
      tags: [presence]
      summary: Stream SSE de presencia del documento (peers vivos, en vivo).
      description: >-
        `text/event-stream`. Al conectar, emite el snapshot completo de peers
        vivos (uno o varios eventos `CadPresenceBeat`); después, un evento por
        cada latido de OTRA réplica o de este mismo proceso, más un `event:
        ping` periódico de mantenimiento que el cliente ignora (no es del tipo
        SSE por defecto). El fan-out entre réplicas de la API usa
        `LISTEN`/`NOTIFY` de PostgreSQL — ver `cad-presence.bus.ts`.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Stream de eventos de presencia.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CadPresenceBeat"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/dxf:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      operationId: getCadDxfBackground
      tags: [dxf]
      summary: Obtiene el plano DXF de fondo del documento.
      description: >-
        DIFERENCIA DELIBERADA con el legacy: `/line-engineering/layout/dxf`
        devuelve `null` cuando no hay plano; v1 responde `404` (subrecurso
        inexistente).
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Plano de fondo (nombre, contenido crudo y colocación).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DxfBackground"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: importCadDxfBackground
      tags: [dxf]
      summary: Importa (carga/reemplaza) el plano DXF de fondo.
      description: >-
        El DXF es un fondo de SOLO LECTURA para calcar; nunca se fusiona con
        las entidades del documento. Límite real del contenido: 12 000 000
        caracteres de texto DXF.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DxfBackgroundUpload"
      responses:
        "200":
          description: Plano importado/actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DxfBackground"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeCadDxfBackground
      tags: [dxf]
      summary: Quita el plano DXF de fondo del documento.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      responses:
        "204":
          description: Plano eliminado.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/documents/{documentId}/export/dxf:
    get:
      operationId: exportCadDocumentDxf
      tags: [dxf]
      summary: Exporta el documento como DXF AutoCAD R12 (capas nombradas).
      description: >-
        Serializa el contenido del documento como DXF R12 con cada tipo en su
        capa (ESTACIONES, EQUIPO, MUROS, ZONAS, FLUJO, COTAS, TEXTO). Igual
        que el legacy, la respuesta es JSON con el texto DXF y el nombre de
        archivo sugerido; el cliente materializa la descarga.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200":
          description: Exportación DXF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DxfExport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cad/blocks:
    get:
      operationId: listCadBlocks
      tags: [blocks]
      summary: Lista la biblioteca de bloques CAD del tenant.
      description: >-
        Búsqueda por términos (`q`) sobre nombre, descripción, keywords y
        businessLink de la definición canónica. Límite real: 200 bloques por
        tenant.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - name: q
          in: query
          description: Términos de búsqueda separados por espacios (AND).
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Bloques ordenados por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/CadBlock"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
    post:
      operationId: createCadBlock
      tags: [blocks]
      summary: Guarda un bloque reutilizable (assets relativos al origen y/o definición canónica).
      description: >-
        Límites reales: 200 bloques por tenant; 200 assets por bloque; la
        definición canónica admite máximo 500 entidades y 1 000 000 bytes, y
        exige `id`, `name`, `basePoint` y al menos una entidad. Se requiere
        al menos uno de `assets` o `definition`.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadBlockCreate"
      responses:
        "201":
          description: Bloque creado (versión 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadBlock"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
  /v1/cad/blocks/{blockId}:
    parameters:
      - $ref: "#/components/parameters/blockId"
    get:
      operationId: getCadBlock
      tags: [blocks]
      summary: Detalle de un bloque CAD.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Bloque.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadBlock"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCadBlock
      tags: [blocks]
      summary: Redefine un bloque (renombra y/o nueva definición canónica; incrementa versión).
      description: >-
        Redefinir `definition` incrementa `version` en 1 (versión de
        biblioteca, monótona). Cambiar solo `name` no la incrementa.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadBlockUpdate"
      responses:
        "200":
          description: Bloque actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadBlock"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeCadBlock
      tags: [blocks]
      summary: Elimina un bloque CAD de la biblioteca.
      description: >-
        Las inserciones previas en documentos NO se ven afectadas: la
        inserción copia la geometría, no referencia al bloque.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      responses:
        "204":
          description: Bloque eliminado.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/messaging/channels:
    get:
      operationId: listMessagingChannels
      tags: [messaging]
      summary: Lista los canales visibles (de proyecto de la organización + directos propios).
      description: >-
        Los canales de PROYECTO son visibles a cualquier miembro de la
        organización sin invitación previa; los DIRECTOS sólo a sus dos
        participantes. Cada fila trae `unreadCount` (mensajes de otra
        persona desde el último `read`) y, en canales directos,
        `otherMember`.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Canales visibles, sin orden garantizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingChannelList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
    post:
      operationId: createMessagingChannel
      tags: [messaging]
      summary: Crea un canal de proyecto o abre uno directo (idempotente).
      description: >-
        `kind: 'project'` exige `projectId` (de un `cad_project` del tenant)
        y `name`. `kind: 'direct'` exige `memberUserId`: si ya existe un
        canal directo entre ambas personas, lo REUTILIZA en vez de duplicar
        — responde 201 igualmente, con el canal existente. Abrir un canal
        directo consigo mismo es `400`.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingChannelCreate"
      responses:
        "201":
          description: Canal creado o, en directos, reutilizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/messaging/channels/{channelId}/messages:
    get:
      operationId: listMessagingChannelMessages
      tags: [messaging]
      summary: Mensajes del canal, paginados por cursor.
      description: >-
        Sin `cursor`: los `limit` mensajes más recientes, en orden
        CRONOLÓGICO ascendente (el más viejo primero, listo para pintar de
        arriba abajo). Con `cursor` (de `nextCursor` de la página anterior):
        los `limit` mensajes anteriores a esa frontera, mismo orden
        ascendente. `nextCursor: null` = no hay mensajes más viejos.
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/messagingChannelId"
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Página de mensajes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingMessagePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMessagingChannelMessage
      tags: [messaging]
      summary: Envía un mensaje al canal, opcionalmente anclado al dibujo o en hilo.
      description: >-
        `anchor` es el MISMO contrato JSON que `CadComment.anchor` — un
        mensaje puede apuntar a una entidad, cara o vista del dibujo.
        `parentMessageId` referencia otro mensaje del MISMO canal (hilo);
        si no pertenece a este canal, `400`. Cuerpo 1–4000 caracteres, no
        vacío tras trim.
      x-required-entitlement: design.cad
      x-required-permission: cad:edit
      parameters:
        - $ref: "#/components/parameters/messagingChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingMessageCreate"
      responses:
        "201":
          description: Mensaje creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/messaging/channels/{channelId}/read:
    post:
      operationId: markMessagingChannelRead
      tags: [messaging]
      summary: Marca el canal como leído hasta ahora (baja `unreadCount` a 0).
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      parameters:
        - $ref: "#/components/parameters/messagingChannelId"
      responses:
        "201":
          description: Marcado.
          content:
            application/json:
              schema:
                type: object
                required: [read]
                properties:
                  read: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/messaging/events:
    get:
      operationId: streamMessagingEvents
      tags: [messaging]
      summary: Mensajes nuevos en vivo (Server-Sent Events) de cualquier canal visible.
      description: >-
        `text/event-stream`: cada evento trae `data` con un `MessagingMessage`
        serializado en JSON. LÍMITE DECLARADO: fanout en memoria de UNA sola
        instancia de proceso — en un despliegue de varias instancias, un
        mensaje enviado en otra instancia no llega por este flujo (se ve al
        recargar). El snapshot de canales DIRECTOS visibles se toma al
        conectar; uno abierto después no aparece hasta reconectar. No usa
        WebSocket a propósito: `EventSource` reutiliza la cookie de sesión
        first-party y pasa por la misma cadena de guards que el resto de la
        API (ver ARCHITECTURE.md).
      x-required-entitlement: design.cad
      x-required-permission: cad:view
      responses:
        "200":
          description: Flujo de eventos, uno por mensaje nuevo.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Frames SSE (`data:` + `MessagingMessage` en JSON)."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-valle_session
      description: >-
        Cookie opaca HttpOnly y first-party. Producción usa
        `__Host-valle_session` con Secure; desarrollo local usa
        `valle_session` sin el prefijo reservado. El servidor resuelve usuario,
        organización activa, tenant y permisos desde la sesión y la membresía;
        ningún parámetro del cliente concede acceso. Toda mutación normal
        exige además `X-CSRF-Token`, igual a la cookie `valle_csrf`.
    reviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: >-
        Token SERVER-OWNED de un review link (Fase 5), generado al crear la
        sesión con `shareLink: true` (única aparición en claro). Viaja en
        header — nunca en la URL (los paths acaban en logs). El servidor lo
        canjea en CADA request: re-hashea (sha256), busca la sesión por
        `token_hash`, y valida expiración (`expiresAt`) y revocación
        (`revokedAt` — cerrar la sesión mata el token de inmediato). El
        tenant y el documento salen de la FILA de la sesión, jamás del
        cliente. Solo autentica la superficie `/v1/cad/review/*`; con este
        contexto cualquier otra ruta es `403 review_read_only`.
  parameters:
    csrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token de doble envio igual a la cookie legible valle_csrf.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    identitySessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    organizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadProjectId"
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadDocumentId"
    sheetSetId:
      name: sheetSetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadSheetSetId"
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadReviewSessionId"
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadCommentId"
    blockId:
      name: blockId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CadBlockId"
    messagingChannelId:
      name: channelId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MessagingChannelId"
    searchQuery:
      name: q
      in: query
      description: Búsqueda por nombre (contains, case-insensitive).
      schema:
        type: string
        maxLength: 200
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: >-
        Solicitud inválida (validación del payload, límites del documento,
        hojas de publicación inválidas, `cad_document_version_required`,
        `cad_publications_server_managed`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Falta la sesión first-party o es inválida/expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Limite de solicitudes excedido sin revelar existencia de cuentas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Sesión sin CSRF válido o sin autoridad para la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    EntitlementRequired:
      description: >-
        Respuesta 403 ESTÁNDAR de los endpoints CAD: el tenant no tiene el
        entitlement `design.cad` vigente (o el usuario carece del permiso
        `cad:*` requerido — ver `details.reason`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EntitlementRequiredError"
    NotFound:
      description: El recurso no existe o no pertenece al tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    VersionConflict:
      description: >-
        CAS fallido: `expectedCadDocumentVersion` no coincide con la versión
        persistida. El cliente debe recargar (`GET` del documento), comparar
        y reintentar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CadDocumentVersionConflictError"
    ReviewTokenRejected:
      description: >-
        Review link rechazado: token desconocido/malformado
        (`review_token_invalid`), expirado (`review_token_expired`) o
        revocado/sesión cerrada (`review_token_revoked`). Las denegaciones
        atribuibles quedan auditadas server-side; el token jamás se registra.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    EmailAddress:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      writeOnly: true
    OpaqueOneTimeToken:
      type: string
      minLength: 32
      maxLength: 256
      writeOnly: true
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
        password: { $ref: "#/components/schemas/Password" }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
        password: { $ref: "#/components/schemas/Password" }
        displayName:
          type: string
          maxLength: 160
    OneTimeTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/OpaqueOneTimeToken" }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: "#/components/schemas/OpaqueOneTimeToken" }
        password: { $ref: "#/components/schemas/Password" }
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [falla, sugerencia, duda]
        message:
          type: string
          minLength: 10
          maxLength: 4000
        context:
          description: >
            Contexto tecnico opcional. Solo viaja con permiso explicito y el
            servidor lo recorta a ruta, navegador, version, documento y tamano de
            ventana. Nunca contiene el dibujo.
          type: object
          additionalProperties: false
          properties:
            ruta: { type: string, maxLength: 200 }
            navegador: { type: string, maxLength: 200 }
            version: { type: string, maxLength: 200 }
            documentoId: { type: string, maxLength: 200 }
            ventana: { type: string, maxLength: 200 }
    FeedbackStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [nuevo, leido, planeado, resuelto]
    FeedbackEntry:
      type: object
      additionalProperties: false
      required: [id, kind, message, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [falla, sugerencia, duda]
        message:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [nuevo, leido, planeado, resuelto]
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    FeedbackList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FeedbackEntry" }
    FeedbackAdminEntry:
      allOf:
        - $ref: "#/components/schemas/FeedbackEntry"
        - type: object
          required: [authorEmail, organizationId, context]
          properties:
            authorEmail: { $ref: "#/components/schemas/EmailAddress" }
            organizationId:
              type: [string, "null"]
              format: uuid
            context:
              type: [object, "null"]
              additionalProperties: true
    FeedbackAdminList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/FeedbackAdminEntry" }
    CallJoinRequest:
      type: object
      additionalProperties: false
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        displayName:
          type: string
          maxLength: 120
          description: >
            Nombre para las miniaturas. Si falta, se usa el correo de la
            sesión.
    CallLeaveRequest:
      type: object
      additionalProperties: false
      required: [participantId]
      properties:
        participantId: { type: string, format: uuid }
    CallSignalKind:
      type: string
      enum: [offer, answer, ice-candidate, bye]
    CallSignalRequest:
      type: object
      additionalProperties: false
      required: [fromParticipantId, toParticipantId, kind, payload]
      properties:
        fromParticipantId: { type: string, format: uuid }
        toParticipantId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CallSignalKind" }
        payload:
          type: object
          additionalProperties: true
          description: >
            Opaco para el servidor: `RTCSessionDescriptionInit` para
            oferta/respuesta, `RTCIceCandidateInit` para un candidato. Lo
            define el navegador, no este contrato.
    CallParticipant:
      type: object
      additionalProperties: false
      required: [id, userId, name, joinedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        joinedAt: { $ref: "#/components/schemas/Timestamp" }
    CallIceServer:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          items: { type: string }
        username: { type: string }
        credential: { type: string }
    CallJoinResponse:
      type: object
      additionalProperties: false
      required:
        [
          roomId,
          documentId,
          participantId,
          participants,
          iceServers,
          turnConfigured,
          maxParticipants,
        ]
      properties:
        roomId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        participants:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/CallParticipant" }
        iceServers:
          type: array
          items: { $ref: "#/components/schemas/CallIceServer" }
        turnConfigured:
          type: boolean
          description: >
            false cuando el despliegue no configuró TURN: las llamadas entre
            redes que no atraviesan NAT directo van a fallar y el cliente
            debe decirlo en vez de quedarse "conectando".
        maxParticipants:
          type: integer
          description: Tope de la malla completa que esta sala usa.
    CallServerEvent:
      description: >
        Union discriminada por `type`, la forma de CADA evento del stream
        `GET /v1/calls/rooms/{roomId}/events`. `text/event-stream` no es
        JSON puro (es `data: <json>\n\n` por mensaje); este schema describe
        el JSON de un solo `data`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, participants]
          properties:
            type: { type: string, enum: [roster] }
            participants:
              type: array
              maxItems: 4
              items: { $ref: "#/components/schemas/CallParticipant" }
        - type: object
          additionalProperties: false
          required: [type, signal]
          properties:
            type: { type: string, enum: [signal] }
            signal:
              type: object
              additionalProperties: false
              required: [id, fromParticipantId, kind, payload, queuedAt]
              properties:
                id: { type: string, format: uuid }
                fromParticipantId: { type: string, format: uuid }
                kind: { $ref: "#/components/schemas/CallSignalKind" }
                payload: { type: object, additionalProperties: true }
                queuedAt: { $ref: "#/components/schemas/Timestamp" }
        - type: object
          additionalProperties: false
          required: [type, at]
          properties:
            type: { type: string, enum: [ping] }
            at: { $ref: "#/components/schemas/Timestamp" }
    SupportIncidentRequest:
      type: object
      additionalProperties: false
      required: [summary, appVersion, userAgent, documentAuthorized]
      properties:
        summary:
          type: string
          minLength: 10
          maxLength: 2000
          description: Lo que la persona escribe. Es el unico campo que redacta.
        appVersion: { type: string, minLength: 1, maxLength: 120 }
        userAgent: { type: string, minLength: 1, maxLength: 400 }
        activeCommand:
          type: [string, "null"]
          maxLength: 64
          description: El comando en curso cuando fallo, si habia uno.
        documentId:
          type: [string, "null"]
          format: uuid
          description: >
            Solo viaja con documentAuthorized=true. Es el IDENTIFICADOR, nunca el
            contenido del plano: adjuntar el dibujo a un correo seria peor para la
            privacidad, no mejor.
        documentAuthorized:
          type: boolean
          description: La persona autorizo explicitamente mirar su documento.
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { $ref: "#/components/schemas/EmailAddress" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [user, session, organization]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email, emailVerified]
          properties:
            id: { type: string, format: uuid }
            email: { $ref: "#/components/schemas/EmailAddress" }
            emailVerified: { type: boolean }
        session:
          type: object
          additionalProperties: false
          required: [id, expiresAt]
          properties:
            id: { type: string, format: uuid }
            expiresAt: { $ref: "#/components/schemas/Timestamp" }
        organization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationSessionContext"
            - type: "null"
    IdentitySession:
      type: object
      additionalProperties: false
      required: [id, current, createdAt, expiresAt, revokedAt, userAgent]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        userAgent:
          type: [string, "null"]
          maxLength: 500
    IdentitySessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/IdentitySession" }
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required: [mfaRequired, challenge, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          enum: [true]
        challenge:
          type: string
          minLength: 32
          maxLength: 256
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: >-
            Codigo TOTP de seis digitos o codigo de respaldo. El limite alto
            cubre el guion y los espacios con los que se copia un respaldo.
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge:
          type: string
          minLength: 32
          maxLength: 256
        code:
          type: string
          minLength: 6
          maxLength: 32
    PasswordConfirmationRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
    MfaStatus:
      type: object
      additionalProperties: false
      required: [enabled, pending, confirmedAt, backupCodesRemaining]
      properties:
        enabled: { type: boolean }
        pending:
          type: boolean
          description: Hay un alta empezada y sin confirmar con un codigo.
        confirmedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        backupCodesRemaining:
          type: integer
          minimum: 0
          maximum: 10
    MfaSetupResponse:
      type: object
      additionalProperties: false
      required: [secret, uri]
      properties:
        secret:
          type: string
          minLength: 16
          maxLength: 64
          description: Secreto en base32 (RFC 4648), para teclearlo a mano.
        uri:
          type: string
          maxLength: 512
          description: URI otpauth que se pinta como codigo QR.
    MfaActivationResponse:
      type: object
      additionalProperties: false
      required: [enabled, backupCodes]
      properties:
        enabled:
          type: boolean
          enum: [true]
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            maxLength: 16
    MfaDisabledResponse:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          enum: [false]
    MfaBackupCodesResponse:
      type: object
      additionalProperties: false
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            maxLength: 16
    IdentityActivityEvent:
      type: object
      additionalProperties: false
      required: [id, action, createdAt, method, userAgent]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          maxLength: 120
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        method:
          type: [string, "null"]
          maxLength: 32
        userAgent:
          type: [string, "null"]
          maxLength: 200
    IdentityActivityList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/IdentityActivityEvent" }
    SessionRotationResponse:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    EmailVerificationResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified: { type: boolean, const: true }
    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [reset]
      properties:
        reset: { type: boolean, const: true }
    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]
    OrganizationInvitationRole:
      type: string
      enum: [admin, member, viewer]
    CadPermission:
      type: string
      enum: ["cad:view", "cad:edit", "cad:review", "cad:publish", "cad:admin"]
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    OrganizationListItem:
      type: object
      additionalProperties: false
      required: [id, name, slug, role, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/OrganizationRole" }
        active: { type: boolean }
    OrganizationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationListItem" }
    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, suspended, cancelled]
    SubscriptionView:
      type: object
      additionalProperties: false
      required: [planCode, status, trialEndsAt]
      properties:
        planCode: { type: string, maxLength: 80 }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        trialEndsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    OrganizationCreated:
      type: object
      additionalProperties: false
      required: [id, name, slug, ownerUserId, createdAt, tenantId, subscription]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        ownerUserId: { type: string, format: uuid }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        tenantId: { type: string, format: uuid }
        subscription: { $ref: "#/components/schemas/SubscriptionView" }
    ActiveOrganizationRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    OrganizationSessionContext:
      type: object
      additionalProperties: false
      required: [id, name, slug, tenantId, role, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        tenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/OrganizationRole" }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CadPermission" }
    OrganizationContext:
      type: object
      additionalProperties: false
      required: [organization, tenantId, role, permissions]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        tenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/OrganizationRole" }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CadPermission" }
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, userId, email, displayName, role, currentUser, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/EmailAddress" }
        displayName:
          type: [string, "null"]
          maxLength: 160
        role: { $ref: "#/components/schemas/OrganizationRole" }
        currentUser: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    OrganizationMembershipList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/OrganizationMembership" }
    OrganizationInvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
        role: { $ref: "#/components/schemas/OrganizationInvitationRole" }
    OrganizationInvitationCreated:
      type: object
      additionalProperties: false
      required: [accepted, invitationId]
      properties:
        accepted: { type: boolean, const: true }
        invitationId: { type: string, format: uuid }
    OrganizationInvitationAccept:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/OpaqueOneTimeToken" }
    OrganizationInvitationAccepted:
      type: object
      additionalProperties: false
      required: [accepted, organizationId, role]
      properties:
        accepted: { type: boolean, const: true }
        organizationId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/OrganizationInvitationRole" }
    BilledSubscriptionView:
      type: object
      additionalProperties: false
      required:
        [planCode, status, trialEndsAt, currentPeriodEnd, cancelAtPeriodEnd]
      properties:
        planCode: { type: string, maxLength: 80 }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        trialEndsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        currentPeriodEnd:
          description: >-
            Fin del periodo ya pagado; `null` mientras nadie haya cobrado
            (trial o plan gratuito).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cancelAtPeriodEnd:
          type: boolean
          description: >-
            Baja programada: la suscripcion sigue vigente hasta
            `currentPeriodEnd`. No es lo mismo que el estado `cancelled`.
    EffectiveSubscriptionView:
      type: object
      additionalProperties: false
      required:
        [
          planCode,
          status,
          trialEndsAt,
          currentPeriodEnd,
          cancelAtPeriodEnd,
          seats,
          effective,
        ]
      properties:
        planCode: { type: string, maxLength: 80 }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        trialEndsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        currentPeriodEnd:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cancelAtPeriodEnd: { type: boolean }
        seats:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            Asientos PAGADOS. Es el limite que la API impone al invitar, no un
            dato informativo: pasado ese numero, invitar o aceptar responde
            409 `seat_limit_reached`.
        effective: { type: boolean }
    PaymentMethod:
      type: string
      enum: [card, oxxo, spei]
      description: >-
        `oxxo` y `spei` son pagos ASINCRONOS de un solo periodo: el dinero
        llega horas o dias despues y no se domicilian, asi que no renuevan
        solos. Existen porque buena parte del mercado mexicano no tiene
        tarjeta de credito.
    CommercialPendingPayment:
      type: object
      additionalProperties: false
      required: [method, since, voucherUrl, planCode]
      description: >-
        Pago asincrono en curso. Mientras exista, que la suscripcion no este
        activa es lo NORMAL: presentarlo como fallo empuja al cliente a pagar
        dos veces.
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        since: { $ref: "#/components/schemas/Timestamp" }
        voucherUrl:
          type: [string, "null"]
          format: uri
          description: >-
            Ficha o instrucciones hospedadas por el proveedor, solo HTTPS.
            `null` cuando el proveedor no las publico en el evento: el
            producto no inventa un enlace que no recibio.
        planCode: { type: string, maxLength: 80 }
    CommercialSubscriptionResponse:
      type: object
      additionalProperties: false
      required: [organizationId, subscription, pendingPayment]
      properties:
        organizationId:
          type: [string, "null"]
          format: uuid
        subscription:
          oneOf:
            - $ref: "#/components/schemas/EffectiveSubscriptionView"
            - type: "null"
        pendingPayment:
          oneOf:
            - $ref: "#/components/schemas/CommercialPendingPayment"
            - type: "null"
    EffectiveEntitlementList:
      type: object
      additionalProperties: false
      required: [organizationId, items]
      properties:
        organizationId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, maxLength: 120 }
    PlanPricePeriod:
      type: string
      enum: [monthly, yearly]
    CommercialPlanPrice:
      type: object
      additionalProperties: false
      required: [currency, period, amountCents]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Codigo ISO-4217 de la moneda, en mayusculas.
        period: { $ref: "#/components/schemas/PlanPricePeriod" }
        amountCents:
          type: integer
          minimum: 0
          description: Precio en centimos enteros; jamas decimales flotantes.
    CommercialPlan:
      type: object
      additionalProperties: false
      required: [code, name, entitlements, prices]
      properties:
        code: { type: string, maxLength: 80 }
        name:
          type: string
          maxLength: 200
          description: >-
            Nombre publicable definido por el operador; sin uno, el codigo del
            plan es el nombre.
        entitlements:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, maxLength: 120 }
        prices:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CommercialPlanPrice" }
    CommercialPlanList:
      type: object
      additionalProperties: false
      required: [checkout, items]
      properties:
        checkout:
          allOf:
            - $ref: "#/components/schemas/CommercialCheckoutMode"
          description: >-
            Modo de cobro derivado del proveedor de pagos configurado.
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CommercialPlan" }
    PublicCommercialPlan:
      type: object
      additionalProperties: false
      required:
        [code, name, kind, perSeat, seatsMinimum, taxIncluded, prices]
      description: >-
        Vista PUBLICA de un plan. Deliberadamente mas estrecha que
        `CommercialPlan`: no expone `entitlements`, que son vocabulario
        interno del producto y no le dicen nada a un visitante anonimo.
      properties:
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 200 }
        kind:
          type: string
          enum: [trial, paid]
          description: >-
            `trial` no lleva precio por definicion y por eso puede publicarse
            con `prices` vacio; `paid` sin precio activo no se publica.
        perSeat:
          type: boolean
          description: >-
            Con `true` el importe es POR USUARIO y el total depende de los
            asientos contratados. Publicar un precio por asiento junto a uno
            por cuenta sin distinguirlos seria enganoso.
        seatsMinimum:
          type: integer
          minimum: 1
          maximum: 1000
          description: Asientos minimos contratables; 1 en un plan individual.
        taxIncluded:
          type: boolean
          description: >-
            Con `true` el importe publicado YA incluye impuestos (IVA en
            Mexico); con `false` el impuesto se suma en el cobro.
        prices:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CommercialPlanPrice" }
    PublicCommercialPlanList:
      type: object
      additionalProperties: false
      required: [checkout, items, trialDays]
      properties:
        checkout:
          allOf:
            - $ref: "#/components/schemas/CommercialCheckoutMode"
          description: >-
            Modo de cobro derivado del proveedor configurado. `external`
            significa que la web no puede cobrar todavia y debe decirlo en vez
            de ofrecer un boton que no lleva a ninguna parte.
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PublicCommercialPlan" }
        trialDays:
          type: integer
          minimum: 1
          maximum: 90
          description: >-
            Duracion REAL de la prueba, en dias, tal y como la resuelve
            `TRIAL_DAYS` al arrancar el proceso. La superficie publica anuncia
            la oferta LEYENDO este numero: con `TRIAL_DAYS=90` la pagina dice
            "3 meses gratis" porque el backend concede 90 dias, no porque
            alguien haya escrito "3 meses" en una plantilla. Ninguna cifra vive
            en dos lugares.
    UpgradeIntentStatus:
      type: string
      enum: [pending, confirmed, cancelled]
    UpgradeIntentCreate:
      type: object
      additionalProperties: false
      required: [requestedPlanCode]
      properties:
        requestedPlanCode:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    UpgradeIntentView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          requestedPlanCode,
          status,
          requestedByUserId,
          decidedByUserId,
          decidedAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        requestedPlanCode: { type: string, maxLength: 80 }
        status: { $ref: "#/components/schemas/UpgradeIntentStatus" }
        requestedByUserId: { type: string, format: uuid }
        decidedByUserId:
          type: [string, "null"]
          format: uuid
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    UpgradeIntentList:
      type: object
      additionalProperties: false
      required: [organizationId, items]
      properties:
        organizationId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/UpgradeIntentView" }
    CommercialCheckoutMode:
      type: string
      enum: [external, hosted]
      description: >-
        `external`: el cobro ocurre fuera del producto (asistido) y se registra
        via upgrade-intents. `hosted`: el proveedor aloja la pagina de pago y el
        resultado vuelve por webhook firmado.
    CommercialCheckoutSessionCreate:
      type: object
      additionalProperties: false
      required: [planCode, currency, period]
      properties:
        planCode:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Codigo ISO-4217 en mayusculas; debe tener precio publicado.
        period: { $ref: "#/components/schemas/PlanPricePeriod" }
        seats:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            Asientos contratados en un plan POR USUARIO. Omitido, se cobra el
            minimo del plan. Un plan que no cobra por asiento solo admite 1:
            mandar mas seria pedir algo que su precio no representa. El importe
            NUNCA lo pone el cliente: solo la cantidad, y contra el minimo
            publicado.
        paymentMethod:
          allOf:
            - $ref: "#/components/schemas/PaymentMethod"
          description: >-
            Omitido significa `card`, que es lo que el producto ya hacia. Con
            `oxxo` o `spei` la sesion es de cobro UNICO en MXN y el resultado
            llega despues por webhook.
    CommercialCheckoutSession:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          checkout,
          intentId,
          reference,
          url,
          seats,
          paymentMethod,
          asynchronous,
        ]
      properties:
        provider:
          type: string
          maxLength: 40
          description: Adaptador que atendio la compra (`null`, `stripe`).
        checkout: { $ref: "#/components/schemas/CommercialCheckoutMode" }
        intentId:
          type: string
          format: uuid
          description: Intent auditable que respalda la compra.
        reference:
          type: string
          maxLength: 255
          description: Identificador de la sesion en el proveedor.
        url:
          type: [string, "null"]
          format: uri
          description: >-
            Pagina de pago hospedada; `null` cuando el modo no es `hosted`.
        seats:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            Asientos con los que se abrio la compra. Se devuelve SIEMPRE para
            que la web pueda confirmar lo que se va a cobrar en vez de
            suponerlo a partir de lo que pidio.
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        asynchronous:
          type: boolean
          description: >-
            Con `true` el cobro NO se resuelve en la pagina del proveedor: el
            cliente sale con una ficha de OXXO o una CLABE y el dinero llega
            despues. Es lo que permite a la web decir "te esperamos" en vez de
            "pago fallido" cuando vuelve sin suscripcion activa.
    InvoiceStatus:
      type: string
      enum: [paid, open, uncollectible, void]
    CommercialInvoice:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          amountCents,
          currency,
          status,
          periodStart,
          periodEnd,
          hostedUrl,
          issuedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        number:
          type: [string, "null"]
          maxLength: 80
          description: Numero legible del proveedor; puede faltar en borradores.
        amountCents:
          type: integer
          minimum: 0
          description: Importe en centimos enteros; jamas decimales flotantes.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        periodStart:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        periodEnd:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        hostedUrl:
          type: [string, "null"]
          format: uri
          description: Enlace HTTPS al documento fiscal, que custodia el proveedor.
        issuedAt: { $ref: "#/components/schemas/Timestamp" }
    CommercialInvoiceList:
      type: object
      additionalProperties: false
      required: [organizationId, items]
      properties:
        organizationId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CommercialInvoice" }
    CommercialCfdiReceipt:
      type: object
      additionalProperties: false
      required:
        [id, invoiceId, kind, status, uuid, amountCents, currency,
         filesAvailable, detail, createdAt]
      properties:
        id: { type: string, format: uuid }
        invoiceId:
          type: [string, "null"]
          format: uuid
          description: Factura del proveedor que origina el CFDI; null en la global.
        kind: { type: string, enum: [nominative, global] }
        status:
          type: string
          enum: [pending, issued, manual, pooled, failed]
          description: >-
            `issued`: timbrado (uuid = folio fiscal). `manual`: sin PAC, lo
            emite el equipo. `pooled`: sin datos fiscales, lo cubre la
            factura global del mes. `failed`: rechazo del PAC, en reintento.
        uuid:
          type: [string, "null"]
          maxLength: 40
          description: Folio fiscal del SAT cuando esta timbrado.
        amountCents: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        filesAvailable: { type: boolean }
        detail:
          type: [string, "null"]
          description: Motivo de `manual`/`failed`. Nunca datos de pago.
        createdAt: { type: string, format: date-time }
    CommercialCfdiReceiptList:
      type: object
      additionalProperties: false
      required: [organizationId, issuance, items]
      properties:
        organizationId: { type: string, format: uuid }
        issuance: { $ref: "#/components/schemas/CfdiIssuance" }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CommercialCfdiReceipt" }
    CommercialSubscriptionCancellation:
      type: object
      additionalProperties: false
      required: [organizationId, cancellation, subscription]
      properties:
        organizationId: { type: string, format: uuid }
        cancellation:
          type: object
          additionalProperties: false
          required: [kind, message]
          properties:
            kind:
              type: string
              enum: [scheduled, recorded]
              description: >-
                `scheduled`: el proveedor no renovara al terminar el periodo.
                `recorded`: sin pasarela, la solicitud queda para el operador.
            message: { type: string, maxLength: 400 }
        subscription: { $ref: "#/components/schemas/BilledSubscriptionView" }
    CommercialBillingPortalSession:
      type: object
      additionalProperties: false
      required: [organizationId, url]
      properties:
        organizationId: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: >-
            Portal hospedado por el proveedor, solo HTTPS. Es de UN cliente y
            caduca: no se cachea ni se guarda.
    TaxPersonType:
      type: string
      enum: [fisica, moral]
      description: >-
        Se DERIVA de la longitud del RFC (13 = fisica, 12 = moral) y decide que
        regimenes fiscales son legales para esa fila.
    SatTaxRegime:
      type: object
      additionalProperties: false
      required: [code, name, personTypes]
      properties:
        code:
          type: string
          pattern: "^[0-9]{3}$"
          description: Clave de `c_RegimenFiscal` (601, 612, 626...).
        name: { type: string, maxLength: 200 }
        personTypes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/TaxPersonType" }
    SatCfdiUse:
      type: object
      additionalProperties: false
      required: [code, name, taxRegimeCodes]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{1,2}[0-9]{2}$"
          description: Clave de `c_UsoCFDI` (G03, I04, S01).
        name: { type: string, maxLength: 200 }
        taxRegimeCodes:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: >-
            Regimenes del RECEPTOR que el SAT admite para este uso. Es la causa
            habitual del rechazo "el uso de CFDI no corresponde al regimen
            fiscal del receptor", y por eso se publica en vez de dejarlo al
            azar del desplegable.
          items: { type: string, pattern: "^[0-9]{3}$" }
    SatTaxCatalogs:
      type: object
      additionalProperties: false
      required: [taxRegimes, cfdiUses]
      properties:
        taxRegimes:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SatTaxRegime" }
        cfdiUses:
          type: array
          maxItems: 50
          description: >-
            Subconjunto DELIBERADO del catalogo del SAT: el aplicable a una
            suscripcion de software. Publicar "Gastos funerales" no daria mas
            libertad, daria mas formas de que el CFDI salga mal.
          items: { $ref: "#/components/schemas/SatCfdiUse" }
    CfdiIssuance:
      type: object
      additionalProperties: false
      required: [provider, mode, available]
      description: >-
        Como se emite el CFDI en ESTE despliegue, dicho por el adaptador
        configurado. Con `mode: manual` y `available: false` el producto
        captura, valida y custodia los datos fiscales, pero NO timbra: la
        interfaz debe decir eso mismo en vez de prometer una factura
        automatica.
      properties:
        provider:
          type: string
          maxLength: 40
          description: Adaptador de PAC (`null` mientras no haya uno contratado).
        mode:
          type: string
          enum: [manual, automatic]
        available:
          type: boolean
          description: false = el producto NO puede timbrar por si mismo.
    TaxProfileSave:
      type: object
      additionalProperties: false
      required: [rfc, legalName, taxRegimeCode, cfdiUseCode, postalCode]
      properties:
        rfc:
          type: string
          minLength: 12
          maxLength: 40
          description: >-
            Se normaliza a mayusculas y se le quitan espacios y guiones antes
            de validar. Se comprueba la FORMA del SAT (letras, fecha AAMMDD,
            homoclave); NO se comprueba que exista.
        legalName:
          type: string
          minLength: 1
          maxLength: 400
          description: >-
            Razon social o nombre completo como en la Constancia de Situacion
            Fiscal. Se normaliza a mayusculas y se le retira el regimen de
            capital (`S.A. DE C.V.`), que el SAT no compara.
        taxRegimeCode:
          type: string
          maxLength: 10
          description: Clave de `c_RegimenFiscal`; catalogo cerrado.
        cfdiUseCode:
          type: string
          maxLength: 10
          description: Clave de `c_UsoCFDI`; catalogo cerrado.
        postalCode:
          type: string
          maxLength: 20
          description: Cinco digitos del domicilio fiscal.
    TaxProfileView:
      type: object
      additionalProperties: false
      required:
        [
          rfc,
          personType,
          legalName,
          taxRegimeCode,
          cfdiUseCode,
          postalCode,
          updatedAt,
        ]
      properties:
        rfc: { type: string, minLength: 12, maxLength: 13 }
        personType: { $ref: "#/components/schemas/TaxPersonType" }
        legalName: { type: string, maxLength: 300 }
        taxRegimeCode: { type: string, pattern: "^[0-9]{3}$" }
        cfdiUseCode: { type: string, pattern: "^[A-Z]{1,2}[0-9]{2}$" }
        postalCode: { type: string, pattern: "^[0-9]{5}$" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    TaxProfileResponse:
      type: object
      additionalProperties: false
      required: [organizationId, issuance, profile]
      properties:
        organizationId: { type: string, format: uuid }
        issuance: { $ref: "#/components/schemas/CfdiIssuance" }
        profile:
          oneOf:
            - $ref: "#/components/schemas/TaxProfileView"
            - type: "null"
    TaxProfileIssue:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          enum: [rfc, legalName, taxRegimeCode, cfdiUseCode, postalCode]
        code: { type: string, maxLength: 60 }
        message: { type: string, maxLength: 400 }
    TaxProfileInvalid:
      type: object
      required: [code, message, issues]
      description: >-
        Se devuelven TODOS los campos mal a la vez. Obligar a descubrirlos de
        uno en uno es la forma mas rapida de que alguien abandone el
        formulario justo antes de pagar.
      properties:
        code: { type: string, enum: [tax_profile_invalid] }
        message: { type: string, maxLength: 400 }
        issues:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/TaxProfileIssue" }
    StripeWebhookAccepted:
      type: object
      additionalProperties: false
      required: [received, status, outcome]
      properties:
        received: { type: boolean, const: true }
        status:
          type: string
          enum: [processed, duplicate, ignored]
          description: >-
            `duplicate`: el `event.id` ya estaba apuntado y esta entrega no
            hizo nada. `ignored`: tipo que el producto no modela.
        outcome: { type: string, maxLength: 40 }
    CadProjectId:
      type: string
      format: uuid
      description: Identificador de `cad_projects`.
    CadDocumentId:
      type: string
      format: uuid
      description: Identificador de `cad_documents`.
    CadPublicationId:
      type: string
      format: uuid
      description: Identificador de `cad_publications`.
    CadSheetSetId:
      type: string
      format: uuid
      description: Identificador de `cad_sheet_sets`.
    CadSheetNumbering:
      type: object
      required: [prefix, start, step, padding, suffix]
      description: >-
        Cómo se numeran las hojas: `A-` + 101 + paso 1 da `A-101`, `A-102`…
        `padding` rellena con ceros a la izquierda.
      properties:
        prefix:
          type: string
          maxLength: 32
        start:
          type: integer
        step:
          type: integer
        padding:
          type: integer
          minimum: 0
          maximum: 8
        suffix:
          type: string
          maxLength: 32
    CadSheetSetSheet:
      type: object
      required: [id, order, documentId, layoutId, title, number, revision]
      description: >-
        Una hoja del conjunto: la REFERENCIA a una presentación de un dibujo,
        no su contenido.
      properties:
        id:
          type: string
          maxLength: 64
        order:
          type: integer
          minimum: 0
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        layoutId:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 200
        number:
          type: string
          maxLength: 64
        numberLocked:
          type: boolean
          description: >-
            Conserva su número aunque se reordene el conjunto. Hay planos cuyo
            número es contractual.
        revision:
          type: string
          maxLength: 32
        fields:
          type: object
          additionalProperties:
            type: string
        includeInPublish:
          type: boolean
    CadSheetSetSubset:
      type: object
      required: [id, name, sheetIds]
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        sheetIds:
          type: array
          items:
            type: string
            maxLength: 64
    CadSheetSetSummary:
      type: object
      required: [id, name, sheetCount, version, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadSheetSetId"
        projectId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 500
        sheetCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CadSheetSet:
      allOf:
        - $ref: "#/components/schemas/CadSheetSetSummary"
        - type: object
          required: [fields, numbering, sheets]
          properties:
            fields:
              type: object
              description: Campos comunes que rellenan los cajetines (`%<Proyecto>%`).
              additionalProperties:
                type: string
            numbering:
              $ref: "#/components/schemas/CadSheetNumbering"
            sheets:
              type: array
              items:
                $ref: "#/components/schemas/CadSheetSetSheet"
            subsets:
              type: array
              items:
                $ref: "#/components/schemas/CadSheetSetSubset"
    CadSheetSetCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 500
        projectId:
          $ref: "#/components/schemas/CadProjectId"
        fields:
          type: object
          additionalProperties:
            type: string
        numbering:
          $ref: "#/components/schemas/CadSheetNumbering"
    CadSheetSetSave:
      type: object
      required: [expectedVersion, sheets]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versión que el cliente cree tener. Distinta ⇒ 409.
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 500
        fields:
          type: object
          additionalProperties:
            type: string
        numbering:
          $ref: "#/components/schemas/CadSheetNumbering"
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/CadSheetSetSheet"
        subsets:
          type: array
          items:
            $ref: "#/components/schemas/CadSheetSetSubset"
    CadReviewSessionId:
      type: string
      format: uuid
      description: Identificador de `cad_review_sessions`.
    CadCommentId:
      type: string
      format: uuid
      description: Identificador de `cad_comments`.
    CadBlockId:
      type: string
      format: uuid
      description: Identificador de un bloque de la biblioteca.
    CadDocumentVersionToken:
      type: integer
      minimum: 0
      description: >-
        Token CAS de concurrencia optimista: entero monótono devuelto por la
        última lectura. 0 = documento nunca guardado (primera escritura).
    LegacyModelAlias:
      type: string
      maxLength: 64
      description: >-
        Alias LEGADO persistido del origen del documento. El CAD Studio
        universal usa el centinela `AXOS-CAD-STUDIO`. Valor opaco: se lee y
        escribe tal cual; NO renombrar en v1 (renombre futuro = bump de
        versión de formato).
      examples: [AXOS-CAD-STUDIO, AX-1000]
    LegacyRevisionAlias:
      type: string
      maxLength: 16
      description: >-
        Alias LEGADO de revisión. El CAD Studio universal usa `UNIVERSAL`.
        Mismo tratamiento opaco que `model`.
      examples: [UNIVERSAL, A]
    Actor:
      type: string
      maxLength: 255
      description: Identidad auditada del actor (email del usuario autenticado).
    Timestamp:
      type: string
      format: date-time
      description: Fecha-hora ISO 8601 en UTC.
    LegalDocumentId:
      type: string
      enum: [terms, privacy]
    LegalDocumentVersion:
      type: object
      additionalProperties: false
      required: [documento, version, publicadoEn, url, requiereAceptacion]
      properties:
        documento: { $ref: "#/components/schemas/LegalDocumentId" }
        version:
          type: string
          maxLength: 40
          description: Fecha AAAA-MM-DD de entrada en vigor del texto.
        publicadoEn:
          type: string
          format: date
          description: Fecha de publicacion (solo fecha).
        url:
          type: string
          maxLength: 200
          description: Ruta publica donde vive el texto.
        requiereAceptacion:
          type: boolean
          description: >-
            `true` cuando esta version exige aceptacion explicita. El aviso
            de privacidad es informativo: acredita entrega, no
            consentimiento, y tratarlo como aceptable induciria a usarlo como
            base juridica.
    LegalDocumentList:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/LegalDocumentVersion" }
    LegalAcceptanceRecord:
      type: object
      additionalProperties: false
      required: [document, version, acceptedAt]
      properties:
        document: { $ref: "#/components/schemas/LegalDocumentId" }
        version: { type: string, maxLength: 40 }
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }
    LegalAcceptanceList:
      type: object
      additionalProperties: false
      required: [acceptances]
      properties:
        acceptances:
          type: array
          items: { $ref: "#/components/schemas/LegalAcceptanceRecord" }
    LegalAcceptanceCreate:
      type: object
      additionalProperties: false
      required: [document, version]
      properties:
        document: { $ref: "#/components/schemas/LegalDocumentId" }
        version:
          type: string
          maxLength: 40
          description: >-
            Version EXACTA que el cliente dice haber mostrado. No se acepta
            "la vigente": una version desconocida responde 400.
    LegalAcceptanceConfirmed:
      type: object
      additionalProperties: false
      required: [document, version, registered]
      properties:
        document: { $ref: "#/components/schemas/LegalDocumentId" }
        version: { type: string, maxLength: 40 }
        registered:
          type: boolean
          description: >-
            Siempre `true`; aceptar dos veces la misma version es idempotente
            (el indice unico lo traduce a exito, nunca a 409).
    Sha256:
      type: string
      pattern: "^[A-Fa-f0-9]{64}$"
      description: Hash SHA-256 en hexadecimal (el servidor lo normaliza a minúsculas).
    ApiError:
      type: object
      description: >-
        Cuerpo de error REAL de la API de Design (corrección R3, alineada con
        la implementación R1): el cuerpo estándar de NestJS conservado por el
        filtro global, enriquecido con `requestId` de correlación. Los campos
        contractuales son `code` (catálogo v1) y, según el código, campos
        adicionales de detalle. NO viaja el sobre `ApiErrorEnvelope`
        enterprise (sin `success`/`timestamp`).
      required: [message]
      additionalProperties: true
      properties:
        statusCode:
          type: integer
          description: Presente en los errores con cuerpo estándar de Nest.
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: >-
            Mensaje humano; la validación de payload (class-validator) puede
            responder un array de mensajes.
        code:
          type: string
          description: >-
            Código de error estable y contractual. Catálogo v1:
            `cad_document_version_required`, `cad_document_version_conflict`,
            `cad_publications_server_managed`, `entitlement_required`,
            `review_token_invalid`, `review_token_expired`,
            `review_token_revoked`, `review_session_closed`,
            `review_read_only`, `review_comments_disabled`, `rate_limited`.
        details: {}
        requestId:
          type: string
          description: Correlación con los logs del servidor (`x-request-id`).
    RateLimitedError:
      description: >-
        429 de cualquiera de las superficies acotadas por `ApiRateLimitService`
        (guardado de contenido, archivo, visión, checkout, comentarios de
        review). El techo es generoso a propósito — no mide uso legítimo, sólo
        acota abuso o un cliente roto en bucle — así que un cliente correcto
        reintenta pasado `retryAfterSeconds` en vez de tratarlo como fallo.
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code, retryAfterSeconds]
          properties:
            code:
              type: string
              const: rate_limited
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Segundos hasta que la ventana de la superficie se libere.
    EntitlementRequiredError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: entitlement_required
            details:
              type: object
              properties:
                entitlement:
                  type: string
                  const: design.cad
                reason:
                  type: string
                  enum:
                    [
                      not_entitled,
                      payment_required,
                      permission_denied,
                      read_only_after_lapse,
                    ]
                  description: >-
                    `not_entitled`: el tenant no contrató Design;
                    `payment_required`: grant en `past_due` (ofrecer portal de
                    pago); `permission_denied`: entitlement OK pero el usuario
                    no tiene el permiso `cad:*` requerido;
                    `read_only_after_lapse`: LA REGLA DE ORO — el entitlement
                    EXISTIÓ y venció, así que la sesión conserva `cad:view`
                    (abrir, listar versiones y `GET .../export/dxf` siguen
                    respondiendo 200) y sólo la ESCRITURA responde este 403.
                    Los datos del usuario nunca quedan rehenes de un cobro.
                lapsedAt:
                  $ref: "#/components/schemas/Timestamp"
                  description: >-
                    Sólo con `read_only_after_lapse`: instante en que el
                    entitlement dejó de estar vigente.
                lapseReason:
                  type: string
                  enum: [trial_ended, period_ended]
                  description: >-
                    Sólo con `read_only_after_lapse`: si lo que terminó fue la
                    prueba o el periodo pagado.
                requiredPermission:
                  type: string
                  enum:
                    [
                      "cad:view",
                      "cad:edit",
                      "cad:review",
                      "cad:publish",
                      "cad:admin",
                    ]
    CadDocumentVersionConflictError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code, expected, current]
          description: >-
            CORRECCIÓN R3 (forma real del backend): `expected` y `current`
            viajan en el NIVEL SUPERIOR del cuerpo del 409, no bajo
            `details` — es el eco exacto del `ConflictException` del CAS que
            el editor ya consume.
          properties:
            code:
              type: string
              const: cad_document_version_conflict
            expected:
              type: integer
              minimum: 0
              description: Versión que el escritor declaró haber leído.
            current:
              type: integer
              minimum: 0
              description: Versión realmente persistida.
    CadProject:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadProjectId"
        name:
          type: string
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 500
        status:
          type: string
          enum: [active, archived]
        legacySourceId:
          type: ["string", "null"]
          maxLength: 64
          description: Id del origen legacy (copia de Fase 4). Null = proyecto nativo.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/Actor"
    CadProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 500
    CadProjectUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 500
        status:
          type: string
          enum: [active, archived]
    CadDocumentSummary:
      type: object
      description: Metadatos del documento SIN el documento canónico.
      required: [id, name, cadDocumentVersion, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadDocumentId"
        projectId:
          oneOf:
            - $ref: "#/components/schemas/CadProjectId"
            - type: "null"
        name:
          type: string
          maxLength: 160
        model:
          oneOf:
            - $ref: "#/components/schemas/LegacyModelAlias"
            - type: "null"
        revision:
          oneOf:
            - $ref: "#/components/schemas/LegacyRevisionAlias"
            - type: "null"
        cadDocumentVersion:
          $ref: "#/components/schemas/CadDocumentVersionToken"
        layers:
          type: ["array", "null"]
          description: Capas CAD (id/nombre/color/visible/locked). Null = capa implícita.
          items:
            type: object
        legacySourceId:
          type: ["string", "null"]
          maxLength: 36
          description: Id de `sf_line_layouts` de origen. Null = documento nativo.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/Actor"
    CadDocumentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          $ref: "#/components/schemas/CadProjectId"
        model:
          $ref: "#/components/schemas/LegacyModelAlias"
        revision:
          $ref: "#/components/schemas/LegacyRevisionAlias"
    CadDocumentMetaUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          oneOf:
            - $ref: "#/components/schemas/CadProjectId"
            - type: "null"
        layers:
          type: ["array", "null"]
          items:
            type: object
    CadDocumentResource:
      allOf:
        - $ref: "#/components/schemas/CadDocumentSummary"
        - type: object
          required: [cadDocument]
          properties:
            cadDocument:
              oneOf:
                - $ref: "#/components/schemas/CadDocumentEnvelope"
                - type: "null"
              description: >-
                Null = documento creado pero nunca guardado (versión 0).
                Desde R3 el servidor HIDRATA la respuesta: en la práctica este
                campo siempre es `CadDocumentInline` o null — la rama
                `CadDocumentBlobPointer` del envelope describe el valor
                PERSISTIDO, no lo que responde este GET (cambio aditivo:
                cualquier lector del envelope sigue siendo válido).
            dxf:
              oneOf:
                - $ref: "#/components/schemas/DxfPlacement"
                - type: "null"
              description: >-
                ADITIVO R3 (paridad con el layout legacy): COLOCACIÓN del
                plano DXF de fondo, incluida en la apertura para que el
                cliente sepa si existe sin sondear `GET .../dxf` (los DATOS
                del plano siguen viviendo en ese subrecurso). Null u omitido =
                sin plano de fondo.
    CadDocumentEnvelope:
      description: >-
        Valor persistido del documento canónico: JSON inline cuando es
        compacto (≤ 1 000 000 bytes serializado) o puntero a blob `_storage`
        cuando vive como archivo gzip en el blob store. El cliente distingue
        por la presencia de `_storage.kind === 'document_blob'`.
      oneOf:
        - $ref: "#/components/schemas/CadDocumentInline"
        - $ref: "#/components/schemas/CadDocumentBlobPointer"
    CadDocumentInline:
      type: object
      description: |
        Documento CAD canónico (formato `meta.schema` v1–v3), MISMO formato
        que persiste el backend actual. Límites de validación REALES
        (aplicados server-side en `cad-document-validation.ts`; se documentan
        aquí como contrato — el JSON Schema declara los estructurales):
        * `entities`: máx. 100 000; ids únicos, no vacíos, ≤ 128 chars.
        * `blocks`: máx. 2 000.
        * `constraints`: máx. 250 000.
        * `paperSpaces`: máx. 500; ids únicos; `page.width/height` finitos > 0;
          máx. 32 viewports por hoja (ids únicos, `scale` > 0, `paperBounds` y
          `modelBounds` con `width/height` > 0).
        * `publications`: máx. 1 000 recibos (server-managed: eco exacto).
        * `collaboration`: `versions` ≤ 12, `threads` ≤ 500 (body 1–1000
          chars, status open|resolved), `reviewLinks` ≤ 20 (`readOnly: true`
          obligatorio; SOLO metadato — el servidor REDACTA cualquier `token`
          que llegue o que traigan documentos heredados, sustituyéndolo por
          `hasToken: true`: la credencial del review link es server-owned y
          sólo existe hasheada en `cad_review_sessions.token_hash`),
          `audit` ≤ 500.
        * Profundidad máxima de anidamiento: 64; claves ≤ 128 chars; números
          finitos; serializado ≤ 8 000 000 bytes inline o ≤ 33 554 432 bytes
          vía archivo gzip.
      required: [meta, entities]
      additionalProperties: true
      properties:
        meta:
          type: object
          required: [schema]
          properties:
            schema:
              type: integer
              minimum: 1
              maximum: 3
              description: Versión del FORMATO del documento (v1–v3 soportadas).
            version:
              type: integer
              minimum: 0
              description: Versión de CONTENIDO (la incrementa el editor y la publicación).
        entities:
          type: array
          maxItems: 100000
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
            additionalProperties: true
        blocks:
          type: array
          maxItems: 2000
          items:
            type: object
        constraints:
          type: array
          maxItems: 250000
          items:
            type: object
        paperSpaces:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/PaperSpace"
        publications:
          type: array
          maxItems: 1000
          description: >-
            Recibos embebidos de publicación. SERVER-MANAGED: solo el endpoint
            de publicación los crea; un guardado normal debe hacer eco exacto.
          items:
            $ref: "#/components/schemas/CadPublicationReceiptEmbedded"
        collaboration:
          type: object
          properties:
            versions:
              type: array
              maxItems: 12
              items:
                type: object
            threads:
              type: array
              maxItems: 500
              items:
                type: object
            reviewLinks:
              type: array
              maxItems: 20
              items:
                type: object
            audit:
              type: array
              maxItems: 500
              items:
                type: object
        history:
          type: array
          items:
            type: object
    PaperSpace:
      type: object
      required: [id, page]
      additionalProperties: true
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        page:
          type: object
          required: [width, height]
          properties:
            width:
              type: number
              exclusiveMinimum: 0
            height:
              type: number
              exclusiveMinimum: 0
        includeInPublish:
          type: boolean
          default: true
          description: Si es false, la hoja no puede incluirse en publicaciones.
        viewports:
          type: array
          maxItems: 32
          items:
            type: object
            required: [id, scale, paperBounds, modelBounds]
            additionalProperties: true
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              scale:
                type: number
                exclusiveMinimum: 0
              paperBounds:
                $ref: "#/components/schemas/Bounds"
              modelBounds:
                $ref: "#/components/schemas/Bounds"
    Bounds:
      type: object
      required: [width, height]
      additionalProperties: true
      properties:
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
    CadDocumentBlobPointer:
      type: object
      description: >-
        Puntero a blob del documento canónico grande: el JSON vive comprimido
        (gzip) en el blob store y la fila solo guarda este manifiesto. La
        referencia es por `blobKey` string — nunca una FK.
      required: [_storage, summary]
      properties:
        _storage:
          type: object
          required:
            [
              kind,
              version,
              blobKey,
              sha256,
              encoding,
              compressedBytes,
              uncompressedBytes,
            ]
          properties:
            kind:
              type: string
              const: document_blob
            version:
              type: integer
              const: 1
            blobKey:
              type: string
              minLength: 1
            sha256:
              $ref: "#/components/schemas/Sha256"
            encoding:
              type: string
              const: gzip
            compressedBytes:
              type: integer
              minimum: 1
              maximum: 20971520
              description: Tamaño gzip; límite 20 MiB.
            uncompressedBytes:
              type: integer
              minimum: 1
              maximum: 33554432
              description: Tamaño del JSON descomprimido; límite 32 MiB.
        summary:
          type: object
          required: [schema, contentVersion, entityCount]
          properties:
            schema:
              type: integer
              minimum: 1
              maximum: 3
            contentVersion:
              type: integer
              minimum: 0
            entityCount:
              type: integer
              minimum: 0
              maximum: 100000
    CadDocumentSaveResult:
      type: object
      required: [cadDocumentId, cadDocumentVersion, entityCount]
      properties:
        cadDocumentId:
          $ref: "#/components/schemas/CadDocumentId"
        cadDocumentVersion:
          type: integer
          minimum: 1
          description: Nueva versión CAS; declararla como `expectedCadDocumentVersion` en el siguiente guardado.
        entityCount:
          type: integer
          minimum: 0
        storedAsBlobPointer:
          type: boolean
          description: true si el documento quedó persistido como puntero a blob gzip.
    CadDocumentVersionSummary:
      type: object
      required: [documentId, version, createdAt]
      properties:
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        version:
          type: integer
          minimum: 1
          description: Versión CAS que esta fila representa (única por documento).
        sha256:
          oneOf:
            - $ref: "#/components/schemas/Sha256"
            - type: "null"
          description: Hash del archivo comprimido (puntero) o del JSON inline; null si n/d.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/Actor"
    CadDocumentVersionDetail:
      allOf:
        - $ref: "#/components/schemas/CadDocumentVersionSummary"
        - type: object
          required: [cadDocument]
          properties:
            cadDocument:
              $ref: "#/components/schemas/CadDocumentEnvelope"
              description: >-
                Igual que la apertura del documento, desde R3 la versión
                histórica se entrega HIDRATADA (`CadDocumentInline`), aunque
                se haya persistido como puntero a blob.
    CadPublicationCreate:
      type: object
      required:
        [expectedCadDocumentVersion, paperSpaceIds, fileName, sha256, bytes]
      properties:
        expectedCadDocumentVersion:
          $ref: "#/components/schemas/CadDocumentVersionToken"
        paperSpaceIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Hojas incluidas: deben existir en el documento, sin duplicados y
            publicables (`includeInPublish` distinto de false).
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          minimum: 1
          maximum: 100000000
    CadPublicationReceipt:
      type: object
      description: Recibo inmutable de publicación (fila `cad_publications`).
      required:
        [
          id,
          documentId,
          paperSpaceIds,
          fileName,
          sha256,
          bytes,
          publishedAt,
          publishedBy,
        ]
      properties:
        id:
          $ref: "#/components/schemas/CadPublicationId"
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        paperSpaceIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
        fileName:
          type: string
          maxLength: 255
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          minimum: 1
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
        publishedBy:
          $ref: "#/components/schemas/Actor"
        legacySourceId:
          type: ["string", "null"]
          maxLength: 64
          description: Id del recibo embebido de origen (Fase 4). Null = nativa.
    CadPublicationReceiptEmbedded:
      type: object
      description: Recibo tal como viaja EMBEBIDO dentro del documento canónico.
      required:
        [id, paperSpaceIds, fileName, sha256, bytes, publishedAt, publishedBy]
      properties:
        id:
          type: string
        paperSpaceIds:
          type: array
          minItems: 1
          items:
            type: string
        fileName:
          type: string
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: number
          exclusiveMinimum: 0
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
        publishedBy:
          $ref: "#/components/schemas/Actor"
    CadReviewSession:
      type: object
      required: [id, documentId, status, hasShareLink, allowComments, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadReviewSessionId"
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        status:
          type: string
          enum: [open, closed]
        hasShareLink:
          type: boolean
          description: >-
            true si la sesión tiene review link. El token NUNCA se expone
            aquí: solo se persiste su hash (`token_hash`).
        allowComments:
          type: boolean
          description: >-
            ¿El contexto de review link puede crear/resolver comentarios?
            (El dibujo es de solo lectura en cualquier caso.)
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: >-
            Expiración del review link, FIJADA POR EL SERVIDOR al crear y
            comprobada server-side en cada canje. Null = sesión sin link.
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: >-
            Revocación del link (cerrar la sesión la estampa): desde ese
            instante el token muere — el canje re-valida en cada request.
        closedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/Actor"
    CadReviewSessionCreated:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/CadReviewSession"
        shareToken:
          type: string
          minLength: 16
          maxLength: 256
          description: >-
            ÚNICA aparición del token en claro en toda la API. Presente solo
            si se pidió `shareLink: true`. El servidor persiste únicamente su
            hash; este valor no puede recuperarse después.
    ReviewLinkContext:
      type: object
      description: >-
        Respuesta del canje del review link: contexto de SOLO LECTURA limitado
        al documento de la sesión. La proyección del documento es REDUCIDA a
        propósito (sin projectId, legacySourceId ni metadatos de auditoría del
        autor): el invitado ve el dibujo, no la organización interna.
      required: [session, readOnly, document]
      properties:
        session:
          $ref: "#/components/schemas/CadReviewSession"
        readOnly:
          type: boolean
          const: true
          description: >-
            Siempre true — informativo para la UI. La imposición REAL es del
            backend (403 `review_read_only` fuera de `/v1/cad/review/*`).
        document:
          type: object
          required: [id, name, cadDocumentVersion, cadDocument]
          properties:
            id:
              $ref: "#/components/schemas/CadDocumentId"
            name:
              type: string
              maxLength: 160
            model:
              oneOf:
                - $ref: "#/components/schemas/LegacyModelAlias"
                - type: "null"
            revision:
              oneOf:
                - $ref: "#/components/schemas/LegacyRevisionAlias"
                - type: "null"
            cadDocumentVersion:
              $ref: "#/components/schemas/CadDocumentVersionToken"
            layers:
              type: ["array", "null"]
              items:
                type: object
            cadDocument:
              oneOf:
                - $ref: "#/components/schemas/CadDocumentEnvelope"
                - type: "null"
              description: >-
                Documento canónico HIDRATADO (en la práctica inline o null),
                misma semántica que la apertura del autor.
            dxf:
              oneOf:
                - $ref: "#/components/schemas/DxfPlacement"
                - type: "null"
    CadCommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: Texto del comentario (no vacío tras trim).
        anchor:
          type: ["object", "null"]
          description: >-
            Posición del comentario en el dibujo (coordenadas / entidad
            ancla), JSON libre. Null = sin ancla.
        reviewSessionId:
          oneOf:
            - $ref: "#/components/schemas/CadReviewSessionId"
            - type: "null"
          description: Sesión a la que pertenece; null = comentario directo.
    CadComment:
      type: object
      required: [id, documentId, author, body, resolved, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadCommentId"
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        reviewSessionId:
          oneOf:
            - $ref: "#/components/schemas/CadReviewSessionId"
            - type: "null"
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
          maxLength: 1000
        anchor:
          type: ["object", "null"]
        resolved:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CadPresenceCursor:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    CadPresenceViewport:
      type: object
      required: [minX, minY, maxX, maxY]
      properties:
        minX: { type: number }
        minY: { type: number }
        maxX: { type: number }
        maxY: { type: number }
    CadPresenceBeatCreate:
      type: object
      required: [peerId]
      description: >-
        `documentId` sale de la ruta. `name` y `guest` los decide el
        SERVIDOR (email de la sesión autenticada) — no viajan en el cuerpo.
      properties:
        peerId:
          type: string
          minLength: 1
          maxLength: 100
          description: Identidad de la PESTAÑA emisora (no de la persona).
        cursor:
          oneOf:
            - $ref: "#/components/schemas/CadPresenceCursor"
            - type: "null"
        viewport:
          oneOf:
            - $ref: "#/components/schemas/CadPresenceViewport"
            - type: "null"
    CadPresenceBeat:
      type: object
      description: >-
        Un evento del stream SSE (`data:` de un evento sin `event:` explícito
        — el `ping` de mantenimiento usa `event: ping` y no lleva esta forma).
      required: [peerId, documentId, name, at, guest]
      properties:
        peerId:
          type: string
        documentId:
          $ref: "#/components/schemas/CadDocumentId"
        name:
          type: string
          maxLength: 160
        at:
          type: integer
          description: Reloj del SERVIDOR en el momento del snapshot (epoch ms).
        cursor:
          oneOf:
            - $ref: "#/components/schemas/CadPresenceCursor"
            - type: "null"
        viewport:
          oneOf:
            - $ref: "#/components/schemas/CadPresenceViewport"
            - type: "null"
        guest:
          type: boolean
          description: Siempre `false` en esta versión (ver descripción del tag `presence`).
    DxfBackground:
      type: object
      description: Plano DXF de fondo (solo lectura sobre el dibujo).
      required: [name, data, placement]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        data:
          type: string
          maxLength: 12000000
          description: Contenido DXF crudo (texto). Límite real 12 000 000 caracteres.
        placement:
          $ref: "#/components/schemas/DxfPlacement"
    DxfPlacement:
      type: object
      description: Colocación del plano de fondo sobre el documento.
      properties:
        offsetX:
          type: number
          default: 0
        offsetY:
          type: number
          default: 0
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
        rotation:
          type: number
          default: 0
        visible:
          type: boolean
          default: true
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
    DxfBackgroundUpload:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        data:
          type: string
          minLength: 1
          maxLength: 12000000
        placement:
          $ref: "#/components/schemas/DxfPlacement"
    DxfExport:
      type: object
      required: [fileName, unit, dxf]
      properties:
        fileName:
          type: string
          description: Nombre de archivo sugerido (`*.dxf`).
        unit:
          type: string
          description: Unidad de dibujo (p. ej. mm).
        dxf:
          type: string
          description: Contenido DXF R12 completo como texto.
    CadBlockAsset:
      type: object
      description: Asset del bloque con coordenadas RELATIVAS al origen (0,0) del bloque.
      required: [id, kind, x, y, w, h]
      properties:
        id:
          type: string
          maxLength: 64
        kind:
          type: string
          maxLength: 24
        x:
          type: number
        y:
          type: number
        w:
          type: number
          exclusiveMinimum: 0
        h:
          type: number
          exclusiveMinimum: 0
        rotation:
          type: number
          default: 0
        label:
          type: string
          maxLength: 64
        layer:
          type: string
          maxLength: 64
    CadBlockDefinition:
      type: object
      description: >-
        Definición canónica del bloque (estilo "block definition" de
        AutoCAD). Límites reales: serializada ≤ 1 000 000 bytes; 1–500
        entidades; `id`, `name` y `basePoint` obligatorios.
      required: [id, name, basePoint, entities]
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        basePoint:
          type: object
        entities:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
    CadBlock:
      type: object
      required: [id, name, assets, version, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CadBlockId"
        name:
          type: string
          maxLength: 80
        assets:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CadBlockAsset"
        definition:
          oneOf:
            - $ref: "#/components/schemas/CadBlockDefinition"
            - type: "null"
          description: Null en filas legacy solo-assets.
        version:
          type: integer
          minimum: 1
          description: Versión de biblioteca; se incrementa al redefinir `definition`.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/Actor"
    CadBlockCreate:
      type: object
      required: [name]
      description: Debe incluir al menos uno de `assets` (1–200) o `definition`.
      anyOf:
        - required: [assets]
        - required: [definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        assets:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/CadBlockAsset"
        definition:
          $ref: "#/components/schemas/CadBlockDefinition"
    CadBlockUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        definition:
          $ref: "#/components/schemas/CadBlockDefinition"
    MessagingChannelId:
      type: string
      format: uuid
      description: Identificador de `messaging_channels`.
    MessagingMessageId:
      type: string
      format: uuid
      description: Identificador de `messaging_messages`.
    MessagingChannelKind:
      type: string
      enum: [project, direct]
      description: >-
        `project`: ligado a un `cad_project`, visible a toda la
        organización. `direct`: entre dos personas, sólo visible para ellas.
    MessagingAuthor:
      type: object
      required: [userId, email, displayName]
      properties:
        userId:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Actor"
        displayName:
          oneOf:
            - type: string
            - type: "null"
    MessagingChannel:
      type: object
      required:
        [id, kind, projectId, name, otherMember, unreadCount, lastMessageAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/MessagingChannelId"
        kind:
          $ref: "#/components/schemas/MessagingChannelKind"
        projectId:
          oneOf:
            - $ref: "#/components/schemas/CadProjectId"
            - type: "null"
        name:
          oneOf:
            - type: string
              maxLength: 160
            - type: "null"
        otherMember:
          description: Sólo canales `direct`; `null` en canales `project`.
          oneOf:
            - $ref: "#/components/schemas/MessagingAuthor"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
          description: >-
            Mensajes de OTRA persona desde el último `POST .../read`
            (nunca cuenta los mensajes propios).
        lastMessageAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    MessagingChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MessagingChannel"
    MessagingChannelCreate:
      type: object
      required: [kind]
      description: >-
        `kind: 'project'` exige `projectId` + `name`; `kind: 'direct'` exige
        `memberUserId`. El servidor rechaza (`400`) los campos que no
        correspondan al `kind` declarado si están mal combinados con el
        estado existente (p. ej. `memberUserId` igual al propio usuario).
      properties:
        kind:
          $ref: "#/components/schemas/MessagingChannelKind"
        projectId:
          $ref: "#/components/schemas/CadProjectId"
        name:
          type: string
          minLength: 1
          maxLength: 160
        memberUserId:
          type: string
          format: uuid
          description: "El otro miembro de la organización, para `kind: 'direct'`."
    MessagingMessage:
      type: object
      required: [id, channelId, author, body, parentMessageId, anchor, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/MessagingMessageId"
        channelId:
          $ref: "#/components/schemas/MessagingChannelId"
        author:
          $ref: "#/components/schemas/MessagingAuthor"
        body:
          type: string
          maxLength: 4000
        parentMessageId:
          oneOf:
            - $ref: "#/components/schemas/MessagingMessageId"
            - type: "null"
        anchor:
          type: ["object", "null"]
          description: >-
            Mismo contrato JSON que `CadComment.anchor` — un mensaje puede
            apuntar a una entidad, cara o vista del dibujo. `null` = sin
            ancla (mensaje de conversación normal).
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    MessagingMessageCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        parentMessageId:
          oneOf:
            - $ref: "#/components/schemas/MessagingMessageId"
            - type: "null"
        anchor:
          type: ["object", "null"]
    MessagingMessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MessagingMessage"
          description: Orden CRONOLÓGICO ascendente (el más viejo primero).
        nextCursor:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: Pásalo como `cursor` para pedir mensajes más viejos. `null` = no hay más.
