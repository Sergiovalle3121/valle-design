    put:
      operationId: saveCadSheetSet
      tags: [sheet-sets]
      summary: Guarda el conjunto con CAS optimista.
      description: >-
        `expectedVersion` es OBLIGATORIO y debe coincidir con la versión
        almacenada. Si no coincide, la respuesta es 409 con la versión vigente:
