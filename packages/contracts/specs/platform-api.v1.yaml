openapi: 3.1.0
info:
  title: Valle Platform — API mínima consumida por Design (v1)
  version: 1.0.0
  summary: Contrato-objetivo de lo que el producto Design consume de Platform.
  description: |
    **BORRADOR / CONTRATO-OBJETIVO (draft).** Este documento NO describe una
    API ya desplegada: define el contrato MÍNIMO que Platform (platform-core)
    implementará y que el producto **Design** (repo `valle-design`) consumirá
    tras la separación de productos. Fase 2 lo redacta; Platform lo
    implementa después, y hasta entonces valle-design lo cubre con los shims
    de TenantContext/entitlements existentes.

    Superficie mínima (deliberadamente pequeña):
    1. **Identidad** — `GET /v1/identity/whoami`: introspección del bearer
       token; devuelve tenant, usuario y permisos efectivos `cad:*`.
    2. **Entitlements** — `GET /v1/entitlements/{code}`: ¿el tenant tiene el
       entitlement vigente? Design lo usa con `design.cad` para el guard de
       todos sus endpoints (fail-closed: cualquier error ⇒ sin acceso).
    3. **Medición de uso** — `POST /v1/usage`: registro idempotente de uso
       facturable/observable (p. ej. asientos de autor activos,
       publicaciones). Platform agrega; Design solo reporta.

    Autenticación: el MISMO bearer token del usuario final (Design lo
    reenvía) o un token de servicio de Design; Platform decide el esquema al
    implementar, sin cambiar las formas de request/response de este contrato.

    Estado: draft de Fase 2. Se congela al cerrar Fase 3; cambios
    incompatibles = v2.
  contact:
    name: Plataforma Valle — separación de productos (Fase 2)
    email: sergiovallezarate@gmail.com
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: https://platform.api.interno
    description: >-
      Marcador de posición: el host real de platform-core se define al
      implementar este contrato.
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Introspección de identidad del bearer token.
  - name: entitlements
    description: Consulta de entitlements comerciales del tenant.
  - name: usage
    description: Medición de uso reportada por los productos.
paths:
  /v1/identity/whoami:
    get:
      operationId: whoami
      tags: [identity]
      summary: Introspección del token — tenant, usuario y permisos efectivos.
      description: >-
        Devuelve la identidad resuelta del bearer token presentado. Design la
        usa para poblar su contexto de tenant y evaluar RBAC `cad:*`. Los
        permisos devueltos ya son EFECTIVOS (rol + overrides); Design no
        recalcula roles.
      responses:
        '200':
          description: Identidad resuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/entitlements/{code}:
    get:
      operationId: getEntitlement
      tags: [entitlements]
      summary: ¿El tenant del token tiene este entitlement vigente?
      description: |
        Consulta puntual de un entitlement (capacidad comercial) del catálogo
        `PRODUCT_CAPABILITY_IDS` de `@axos/contracts` — Design consulta
        `design.cad`. Semántica fail-closed: `active` solo es `true` con un
        grant en estado que concede acceso (`active`/`trialing` vigente);
        cualquier otro estado, error o desconocimiento ⇒ `false`.
      parameters:
        - name: code
          in: path
          required: true
          description: Código de entitlement (p. ej. `design.cad`).
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*$'
            examples: [design.cad]
      responses:
        '200':
          description: Estado del entitlement para el tenant del token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El código no existe en el catálogo de capacidades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/usage:
    post:
      operationId: recordUsage
      tags: [usage]
      summary: Registra un evento de uso medible (idempotente).
      description: >-
        Design reporta uso; Platform deduplica por `idempotencyKey` y agrega
        para facturación/observabilidad. La aceptación es asíncrona (202):
        un registro aceptado puede descartarse después como duplicado sin
        error para el emisor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageRecord'
      responses:
        '202':
          description: Registro aceptado para agregación.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
                    const: true
        '400':
          description: Registro inválido (métrica desconocida, cantidad no positiva).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token de usuario final (reenviado) o de servicio de Design.
  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: Sobre estándar de error (`ApiErrorEnvelope` de `@axos/contracts`).
      required: [success, statusCode, message, timestamp]
      properties:
        success:
          type: boolean
          const: false
        statusCode:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        details: {}
    WhoAmI:
      type: object
      required: [tenantId, user, permissions]
      properties:
        tenantId:
          type: string
          description: Tenant al que pertenece el token.
        plantId:
          type: ['string', 'null']
          description: Planta/sitio activo del contexto, si aplica.
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
        permissions:
          type: array
          items:
            type: string
          description: >-
            Permisos EFECTIVOS del usuario. Design filtra los suyos:
            `cad:view`, `cad:edit`, `cad:review`, `cad:publish`, `cad:admin`.
          examples:
            - ['cad:view', 'cad:edit', 'cad:publish']
    EntitlementStatus:
      type: object
      required: [code, active]
      properties:
        code:
          type: string
          description: Código consultado (eco).
          examples: [design.cad]
        active:
          type: boolean
          description: true solo con un grant vigente que concede acceso (fail-closed).
        reason:
          type: string
          enum: [not_entitled, payment_required]
          description: >-
            Presente solo cuando `active` es false: distingue "no contratado"
            de "cobro fallido" para que la UI ofrezca la ruta correcta
            (contratar vs portal de pago).
    UsageRecord:
      type: object
      required: [productCode, metric, quantity, occurredAt, idempotencyKey]
      properties:
        productCode:
          type: string
          const: design
          description: Producto emisor. Design siempre reporta `design`.
        metric:
          type: string
          enum: [author_seat_active, document_saved, publication_recorded]
          description: >-
            Métrica medida. Catálogo inicial mínimo; ampliarlo es cambio
            compatible (los consumidores ignoran métricas desconocidas).
        quantity:
          type: number
          exclusiveMinimum: 0
        occurredAt:
          type: string
          format: date-time
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          description: Clave de deduplicación del registro (única por emisor).
        subjectId:
          type: string
          description: >-
            Sujeto medido opcional (p. ej. `cadDocumentId` o userId del
            asiento), para auditoría de la agregación.
