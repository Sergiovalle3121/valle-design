# Dependabot: vigilancia semanal de dependencias npm.
#
# Agrupado en UN solo PR semanal: la cuota de Actions de este repo es escasa
# (ver ci.yml) y cada PR de dependencias dispara el pipeline completo. Un grupo
# semanal produce un veredicto por semana en vez de uno por paquete.
#
# Las actualizaciones de SEGURIDAD no esperan al lunes: Dependabot las abre en
# cuanto aparece el aviso, también agrupadas.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      npm-semanal:
        applies-to: version-updates
        patterns:
          - "*"
      npm-seguridad:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    # Bloqueos mayores verificados empíricamente — ver docs/deps-majors-bloqueados.md.
    # No quitar una fila de aquí sin tachar la fila correspondiente en ese documento
    # con la evidencia de que el bloqueo se resolvió. Sin esto, el grupo semanal
    # (patterns: "*") vuelve a proponer el mismo paquete roto cada lunes.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        versions: [">= 16.3.0"]
      - dependency-name: "eslint-config-next"
        versions: [">= 16.3.0"]
      - dependency-name: "@playwright/test"

  # Los SHA pineados de las actions de ci.yml/release.yml no se renuevan
  # solos: el pinning sin renovación automática es deuda, no seguridad — la
  # CVE de una action pineada se queda clavada hasta que alguien se acuerde.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 2
    groups:
      actions-semanal:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Las bases por digest de los Dockerfiles (node@sha256:…) avanzan cuando
  # upstream publica un patch; sin este ecosistema el digest fijado envejece
  # en silencio.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
