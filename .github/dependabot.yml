# Dependabot: vigilancia semanal de dependencias npm.
#
# Agrupado en UN solo PR semanal: la cuota de Actions de este repo es escasa
# (ver ci.yml) y cada PR de dependencias dispara el pipeline completo. Un grupo
# semanal produce un veredicto por semana en vez de uno por paquete.
#
# Las actualizaciones de SEGURIDAD no esperan al lunes: Dependabot las abre en
# cuanto aparece el aviso, también agrupadas.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      npm-semanal:
        applies-to: version-updates
        patterns:
          - "*"
      npm-seguridad:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    # Bloqueos mayores verificados empíricamente — ver docs/deps-majors-bloqueados.md.
    # No quitar una fila de aquí sin tachar la fila correspondiente en ese documento
    # con la evidencia de que el bloqueo se resolvió. Sin esto, el grupo semanal
    # (patterns: "*") vuelve a proponer el mismo paquete roto cada lunes.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        versions: [">= 16.3.0"]
      - dependency-name: "eslint-config-next"
        versions: [">= 16.3.0"]
      - dependency-name: "@playwright/test"
      # next-intl 4.14 añadió una dependencia de TIEMPO DE EJECUCIÓN a
      # @swc/core ~1.16, cuyo peer exige @swc/helpers >= 0.5.17. `next` fija
      # @swc/helpers 0.5.15 EXACTO y npm lo iza a la raíz, así que el árbol
      # queda incoherente: `npm ci` instala, pero `npm sbom` aborta con
      # ESBOMPROBLEMS y el SBOM es un artefacto de cumplimiento que no puede
      # describir un árbol roto. Medido el 2026-09-02 sobre el PR #155.
      #
      # Forzar @swc/helpers por encima del pin de Next es plausible y NO está
      # medido: los helpers van acoplados al compilador que emitió el código.
      # Se retiene next-intl hasta que Next mueva su pin, y los demás bumps del
      # grupo semanal siguen entrando.
      - dependency-name: "next-intl"
        versions: [">= 4.14.0"]
      # @nestjs 12 arrastra @angular-devkit@22.1.5, que exige Node ^22.22.3 y
      # este repo fija 20 en .nvmrc y en ambos Dockerfiles. Medido el
      # 2026-09-01 sobre el PR #144, que además NO instalaba: su lockfile
      # seguía en 11.2.3 mientras su package.json pedía 12.0.1.
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/platform-express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/typeorm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/schematics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/testing"
        update-types: ["version-update:semver-major"]

  # Los SHA pineados de las actions de ci.yml/release.yml no se renuevan
  # solos: el pinning sin renovación automática es deuda, no seguridad — la
  # CVE de una action pineada se queda clavada hasta que alguien se acuerde.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 2
    groups:
      actions-semanal:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    # SÓLO menores y parches, y el motivo NO es miedo a los mayores.
    #
    # El pinning por SHA de `scripts/check-proprietary-governance.mjs` exige
    # revisión humana de cada versión nueva, y eso es deliberado: es lo que
    # impide que una action cambie bajo los pies del CI. Lo que no funciona es
    # pedirle a un bot que proponga saltos de TRES o CUATRO mayores de golpe:
    # ese PR no puede pasar el gate por construcción, y un PR semanal que nunca
    # puede fusionarse deja de ser una señal y pasa a ser ruido — el PR #143
    # llevaba diecisiete horas abierto sin ninguna posibilidad de entrar.
    #
    # Lo que de verdad da seguridad SÍ sigue llegando: el parche que arregla una
    # CVE de una action es un parche, no un mayor, y esos siguen proponiéndose.
    # Los mayores van por ventana dedicada, uno a uno, actualizando el SHA
    # pineado en el mismo commit y validando con una corrida completa de CI.
    # Ver docs/deps-majors-bloqueados.md.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Las bases por digest de los Dockerfiles (node@sha256:…) avanzan cuando
  # upstream publica un patch; sin este ecosistema el digest fijado envejece
  # en silencio.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
