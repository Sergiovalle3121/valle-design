name: Release

# Construye y publica los ARTEFACTOS de una versión desplegable: las dos
# imágenes de contenedor, el SBOM de la cadena de suministro y un manifiesto de
# despliegue con los digests exactos.
#
# Por qué existe separado de CI: `ci.yml` responde «¿este commit es correcto?».
# Esto responde «¿qué se despliega, y cómo se demuestra que es lo que dice
# ser?». Un cliente que pregunta qué corre en su instalación necesita un
# digest, no un nombre de rama.
#
# NUNCA corre en un push normal. La cuota de Actions de este repo está al
# límite, y construir dos imágenes cuesta minutos reales:
#   · `workflow_dispatch` → a mano, con opciones;
#   · `push` de una etiqueta `v*` → un release de verdad.
on:
  workflow_dispatch:
    inputs:
      publicar_imagenes:
        description: 'Publicar las imágenes en GHCR (si no, sólo se construyen)'
        type: boolean
        default: false
      api_url:
        description: 'NEXT_PUBLIC_API_URL — se INCRUSTA en el bundle del web'
        type: string
        default: 'https://api.example.com'
      desplegar_staging:
        description: 'Desplegar a STAGING tras publicar (exige publicar_imagenes)'
        type: boolean
        default: false
      dwg_native_import_beta:
        description: 'NEXT_PUBLIC_DWG_NATIVE_IMPORT_BETA — activa la beta de importación DWG AC1015 (ADR-0009 §6-bis/ter/quater). Apagada por defecto.'
        type: boolean
        default: false
      dwg_ac1018_import_beta:
        description: 'NEXT_PUBLIC_DWG_AC1018_IMPORT_BETA — ADEMÁS acepta AC1018/2004 (ADR-0009 §7). Exige dwg_native_import_beta también activo; sin la beta base no habilita nada.'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  # Nunca se cancela: un release a medias deja imágenes publicadas sin
  # manifiesto, que es peor que un release lento.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Imágenes + SBOM + manifiesto
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Lo que los jobs de deploy necesitan saber del release: la versión y los
    # DIGESTS. Se despliega por digest, nunca por tag — un tag se puede mover.
    outputs:
      version: ${{ steps.version.outputs.version }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Barato y bloqueante: si la imagen no cumple los invariantes de
      # despliegue, no se construye nada. Falla en segundos.
      - name: Gate de imagen reproducible
        run: node scripts/deploy/validate-dockerfiles.mjs

      - name: Install dependencies (npm ci reproducible)
        run: npm ci

      # SBOM de PRODUCCIÓN (sin dev) + gate de licencias: el producto es
      # UNLICENSED y una copyleft fuerte en el árbol de runtime cambiaría las
      # obligaciones de distribución del binario que aquí se empaqueta.
      - name: SBOM CycloneDX y gate de licencias
        run: npm run sbom && npm run check:licenses

      - name: Determinar versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-dispatch.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versión del release: ${VERSION}"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login en GHCR
        if: inputs.publicar_imagenes || github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `provenance: false` mantiene el manifiesto en un solo digest legible:
      # con provenance, `docker buildx` publica un índice y el digest que
      # aparece en el manifiesto de despliegue deja de ser el de la imagen.
      - name: Construir imagen de la API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ inputs.publicar_imagenes || github.ref_type == 'tag' }}
          load: ${{ !(inputs.publicar_imagenes || github.ref_type == 'tag') }}
          tags: |
            ${{ env.IMAGE_BASE }}/api:${{ steps.version.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # OJO: TODA variable NEXT_PUBLIC_* se incrusta en el bundle. Esta imagen
      # SÓLO sirve para el origen y la marca con los que se construyó;
      # desplegarla contra otro host produce un web que llama a la API
      # equivocada desde el navegador del cliente, y el error no aparece en
      # ningún log del servidor.
      #
      # `apps/web/Dockerfile` corre `check:production-config` durante el
      # build: revienta si estas CUATRO llegan vacías o con un dominio de
      # plantilla (`*.invalid`), así que son OBLIGATORIAS antes del próximo
      # tag `v*` —configúralas como repository variables (Settings → Secrets
      # and variables → Actions → Variables), igual que ya existe
      # `RELEASE_API_URL`—:
      #   RELEASE_BRAND_WEBSITE_URL, RELEASE_BRAND_SUPPORT_EMAIL,
      #   RELEASE_BRAND_SALES_EMAIL, RELEASE_BRAND_PRIVACY_EMAIL
      # El resto de RELEASE_* de este bloque es opcional (default seguro).
      - name: Construir imagen del web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ inputs.publicar_imagenes || github.ref_type == 'tag' }}
          load: ${{ !(inputs.publicar_imagenes || github.ref_type == 'tag') }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || vars.RELEASE_API_URL || 'https://api.example.com' }}
            NEXT_PUBLIC_DWG_NATIVE_IMPORT_BETA=${{ (inputs.dwg_native_import_beta && 'true') || vars.RELEASE_DWG_NATIVE_IMPORT_BETA || 'false' }}
            NEXT_PUBLIC_DWG_AC1018_IMPORT_BETA=${{ (inputs.dwg_ac1018_import_beta && 'true') || vars.RELEASE_DWG_AC1018_IMPORT_BETA || 'false' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.RELEASE_SITE_URL }}
            NEXT_PUBLIC_SALES_URL=${{ vars.RELEASE_SALES_URL }}
            NEXT_PUBLIC_DOCUMENTATION_URL=${{ vars.RELEASE_DOCUMENTATION_URL }}
            NEXT_PUBLIC_PRICING_URL=${{ vars.RELEASE_PRICING_URL }}
            NEXT_PUBLIC_SUPPORT_URL=${{ vars.RELEASE_SUPPORT_URL }}
            NEXT_PUBLIC_STATUS_URL=${{ vars.RELEASE_STATUS_URL }}
            NEXT_PUBLIC_CONTACT_URL=${{ vars.RELEASE_CONTACT_URL }}
            NEXT_PUBLIC_PRIVACY_URL=${{ vars.RELEASE_PRIVACY_URL }}
            NEXT_PUBLIC_TERMS_URL=${{ vars.RELEASE_TERMS_URL }}
            NEXT_PUBLIC_LICENSES_URL=${{ vars.RELEASE_LICENSES_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ vars.RELEASE_BRAND_NAME }}
            NEXT_PUBLIC_BRAND_LEGAL_ENTITY=${{ vars.RELEASE_BRAND_LEGAL_ENTITY }}
            NEXT_PUBLIC_BRAND_FOUNDER=${{ vars.RELEASE_BRAND_FOUNDER }}
            NEXT_PUBLIC_BRAND_DESCRIPTOR=${{ vars.RELEASE_BRAND_DESCRIPTOR }}
            NEXT_PUBLIC_BRAND_TAGLINE_EN=${{ vars.RELEASE_BRAND_TAGLINE_EN }}
            NEXT_PUBLIC_BRAND_TAGLINE_ES=${{ vars.RELEASE_BRAND_TAGLINE_ES }}
            NEXT_PUBLIC_BRAND_SUPPORT_EMAIL=${{ vars.RELEASE_BRAND_SUPPORT_EMAIL }}
            NEXT_PUBLIC_BRAND_SALES_EMAIL=${{ vars.RELEASE_BRAND_SALES_EMAIL }}
            NEXT_PUBLIC_BRAND_PRIVACY_EMAIL=${{ vars.RELEASE_BRAND_PRIVACY_EMAIL }}
            NEXT_PUBLIC_BRAND_WEBSITE_URL=${{ vars.RELEASE_BRAND_WEBSITE_URL }}
            NEXT_PUBLIC_BRAND_COPYRIGHT=${{ vars.RELEASE_BRAND_COPYRIGHT }}
            NEXT_PUBLIC_BRAND_COPYRIGHT_YEAR=${{ vars.RELEASE_BRAND_COPYRIGHT_YEAR }}
            NEXT_PUBLIC_BRAND_TRADEMARK_STATUS=${{ vars.RELEASE_BRAND_TRADEMARK_STATUS }}
            NEXT_PUBLIC_BRAND_TRADEMARK_SYMBOL=${{ vars.RELEASE_BRAND_TRADEMARK_SYMBOL }}
            NEXT_PUBLIC_BRAND_LOGO_MARK=${{ vars.RELEASE_BRAND_LOGO_MARK }}
            NEXT_PUBLIC_BRAND_LOGO_ICON=${{ vars.RELEASE_BRAND_LOGO_ICON }}
            NEXT_PUBLIC_BRAND_PRODUCT_NAME_DESIGN=${{ vars.RELEASE_BRAND_PRODUCT_NAME_DESIGN }}
          tags: |
            ${{ env.IMAGE_BASE }}/web:${{ steps.version.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # El manifiesto es lo que hace auditable el despliegue: qué commit, qué
      # digests, qué origen de API quedó incrustado y qué migración es la
      # última de la cadena. Sin esto, «qué versión corre en producción» se
      # responde de memoria.
      - name: Manifiesto de despliegue
        run: |
          LAST_MIGRATION=$(ls apps/api/src/migrations/*.ts \
            | grep -v '\.spec\.ts$' | sort | tail -1 | xargs -n1 basename)
          cat > release-manifest.json <<JSON
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ github.sha }}",
            "construidoEn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "node": "$(node --version)",
            "imagenes": {
              "api": {
                "referencia": "${{ env.IMAGE_BASE }}/api:${{ steps.version.outputs.version }}",
                "digest": "${{ steps.api.outputs.digest }}"
              },
              "web": {
                "referencia": "${{ env.IMAGE_BASE }}/web:${{ steps.version.outputs.version }}",
                "digest": "${{ steps.web.outputs.digest }}",
                "apiUrlIncrustada": "${{ inputs.api_url || vars.RELEASE_API_URL || 'https://api.example.com' }}",
                "dwgNativeImportBeta": "${{ (inputs.dwg_native_import_beta && 'true') || vars.RELEASE_DWG_NATIVE_IMPORT_BETA || 'false' }}",
                "dwgAc1018ImportBeta": "${{ (inputs.dwg_ac1018_import_beta && 'true') || vars.RELEASE_DWG_AC1018_IMPORT_BETA || 'false' }}"
              }
            },
            "ultimaMigracion": "${LAST_MIGRATION}",
            "publicado": ${{ inputs.publicar_imagenes || github.ref_type == 'tag' }}
          }
          JSON
          cat release-manifest.json

      - name: Subir artefactos del release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            release-manifest.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 365

      # Sólo para etiquetas: un dispatch manual es un ensayo, no un release.
      - name: Adjuntar artefactos al release de GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            release-manifest.json sbom.cdx.json --clobber

      - name: Resumen
        run: |
          {
            echo "## Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "| Artefacto | Digest |"
            echo "| --- | --- |"
            echo "| API | \`${{ steps.api.outputs.digest }}\` |"
            echo "| Web | \`${{ steps.web.outputs.digest }}\` |"
            echo ""
            echo "Procedimiento de despliegue y rollback: \`DEPLOYMENT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY A PRODUCCIÓN — sólo en releases de etiqueta, y sólo si el VPS está
  # cableado en secrets. Tres decisiones deliberadas:
  #
  #   · `environment: production`: si el environment tiene required reviewers
  #     configurados en GitHub, el job ESPERA la aprobación humana antes de
  #     tocar producción. Sin reviewers, pasa directo — configurarlos es un
  #     clic en Settings → Environments y se recomienda hacerlo.
  #   · La presencia de secrets se decide EN UN STEP (un `if:` de job no puede
  #     leer secrets): sin DEPLOY_SSH_KEY/HOST/USER el job termina en verde
  #     con el aviso de que el deploy sigue siendo manual (DEPLOYMENT.md §3).
  #     Ni rojo permanente ni despliegue a medias.
  #   · Se despliega por DIGEST del job release, se migra ANTES de rotar con
  #     la misma imagen (DEPLOYMENT.md §3.2) y hay gate de readiness con
  #     reintentos: si `/health/ready` no llega a 200, el job falla y lo dice.
  #
  # Secrets del environment `production`:
  #   DEPLOY_SSH_KEY      clave privada (sólo para esto; ed25519 recomendada)
  #   DEPLOY_HOST         IP o hostname del VPS
  #   DEPLOY_USER         usuario con docker (p. ej. `deploy`)
  #   DEPLOY_KNOWN_HOSTS  (opcional) salida de `ssh-keyscan -H $HOST`; sin él
  #                       se hace TOFU con ssh-keyscan en el momento
  # Variable (no secret): RELEASE_API_URL — ya usada para construir el web —
  # sirve además de URL del gate externo de readiness.
  deploy:
    name: Deploy a producción (VPS)
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: ¿Está cableado el despliegue?
        id: gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy automático SIN configurar (faltan DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER en el environment production). El release quedó publicado; el despliegue sigue siendo manual: DEPLOYMENT.md §3 + infra/README.md."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar SSH
        if: steps.gate.outputs.configurado == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # TOFU: la primera conexión confía en lo que responda el host. Para
            # cerrarlo, guarda `ssh-keyscan -H $HOST` en DEPLOY_KNOWN_HOSTS.
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Migrar y rotar en el VPS (por digest, con gate de readiness)
        if: steps.gate.outputs.configurado == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          API_IMAGE: ${{ env.IMAGE_BASE }}/api@${{ needs.release.outputs.api_digest }}
          WEB_IMAGE: ${{ env.IMAGE_BASE }}/web@${{ needs.release.outputs.web_digest }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' RELEASE_VERSION='$RELEASE_VERSION' bash -s" <<'REMOTO'
          set -euo pipefail
          cd /srv/valle

          # Fija las imágenes del release EN .env: un `up -d` posterior desde
          # cualquier shell del VPS levanta esta misma versión, no una vieja.
          fijar() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          fijar API_IMAGE "$API_IMAGE"
          fijar WEB_IMAGE "$WEB_IMAGE"
          fijar RELEASE_VERSION "$RELEASE_VERSION"

          docker compose -f compose.prod.yml pull

          # Migraciones como paso único y observable, ANTES de rotar, con la
          # imagen NUEVA — el comando exacto de DEPLOYMENT.md §3.2.
          docker compose -f compose.prod.yml run --rm api \
            npx typeorm migration:run -d apps/api/dist/typeorm-cli.datasource.js

          docker compose -f compose.prod.yml up -d

          # Gate de readiness DESDE DENTRO del contenedor (base + migraciones),
          # con reintentos: un deploy que no llega a ready es un deploy fallido.
          for intento in $(seq 1 30); do
            if docker compose -f compose.prod.yml exec -T api node -e \
              "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "readiness OK (intento $intento)"
              exit 0
            fi
            sleep 5
          done
          echo "/health/ready no llegó a 200 en 150 s: revisa docker compose logs api" >&2
          exit 1
          REMOTO

      - name: Gate externo de readiness (a través de Caddy/TLS)
        if: steps.gate.outputs.configurado == 'true' && vars.RELEASE_API_URL != ''
        run: |
          # El gate interno prueba el proceso; éste prueba lo que ve el mundo:
          # DNS, certificado y proxy. RELEASE_API_URL ya existe como variable
          # del repo (es la que se incrusta en el web).
          for intento in $(seq 1 12); do
            if curl -fsS "${{ vars.RELEASE_API_URL }}/health/ready" >/dev/null; then
              echo "readiness externa OK"
              exit 0
            fi
            sleep 5
          done
          echo "El API no responde en ${{ vars.RELEASE_API_URL }}/health/ready" >&2
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY A STAGING — sólo bajo workflow_dispatch con la casilla marcada, y
  # con imágenes publicadas (sin publicar no hay nada que el VPS pueda hacer
  # pull). Mismo VPS, proyecto compose aparte (infra/compose.staging.yml).
  # Recuerda: la imagen del web de staging debe construirse con
  # api_url=https://api-staging.DOMINIO — la de producción llamaría a la API
  # real desde el navegador de quien prueba.
  deploy-staging:
    name: Deploy a staging (VPS)
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.desplegar_staging && inputs.publicar_imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: ¿Está cableado el despliegue?
        id: gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging SIN configurar (faltan DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER en el environment staging). Despliegue manual: infra/README.md § Staging."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar SSH
        if: steps.gate.outputs.configurado == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Migrar y rotar staging (por digest, con gate de readiness)
        if: steps.gate.outputs.configurado == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          API_IMAGE: ${{ env.IMAGE_BASE }}/api@${{ needs.release.outputs.api_digest }}
          WEB_IMAGE: ${{ env.IMAGE_BASE }}/web@${{ needs.release.outputs.web_digest }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' RELEASE_VERSION='$RELEASE_VERSION' bash -s" <<'REMOTO'
          set -euo pipefail
          cd /srv/valle/staging

          fijar() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          fijar API_IMAGE "$API_IMAGE"
          fijar WEB_IMAGE "$WEB_IMAGE"
          fijar RELEASE_VERSION "$RELEASE_VERSION"

          docker compose -f ../compose.staging.yml pull
          docker compose -f ../compose.staging.yml run --rm api \
            npx typeorm migration:run -d apps/api/dist/typeorm-cli.datasource.js
          docker compose -f ../compose.staging.yml up -d

          for intento in $(seq 1 30); do
            if docker compose -f ../compose.staging.yml exec -T api node -e \
              "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "readiness OK (intento $intento)"
              exit 0
            fi
            sleep 5
          done
          echo "/health/ready de staging no llegó a 200 en 150 s" >&2
          exit 1
          REMOTO
