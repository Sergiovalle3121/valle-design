name: Monitor

# MONITOREO MÍNIMO VIABLE: cada 15 minutos, un chequeo contra el /metrics de
# producción con los umbrales de SLA.md §4 (outbox sin drenar >900 s, filas
# dead >0, endpoint que no responde). Cuando el chequeo falla, el workflow
# falla, y GitHub manda el correo de «workflow failed» al dueño del repo:
# ese correo ES la alerta. No sustituye a un Prometheus con Alertmanager —
# es lo mínimo que convierte los umbrales del SLA en un aviso real, hoy,
# con cero infraestructura nueva.
#
# Configuración (Settings → Secrets and variables → Actions → Secrets):
#   MONITOR_METRICS_URL    https://api.tu-dominio.com/metrics
#   MONITOR_METRICS_TOKEN  el METRICS_TOKEN del despliegue
#
# SIN los secrets, el workflow falla: un verde sin ninguna medición sería una
# señal falsa de salud. Configurar ambos en GitHub Actions es parte del
# encendido del monitoreo de producción.
#
# El cron de GitHub es best-effort (puede retrasarse minutos bajo carga); para
# la detección de caída total del API conviene sumar un UptimeRobot gratuito
# contra /health/ready, que además vigila desde fuera de GitHub.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  # Si una corrida se atasca, la siguiente manda: el dato viejo no interesa.
  cancel-in-progress: true

jobs:
  chequeo:
    name: Umbrales de SLA contra /metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (sólo scripts/ops)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/ops
          sparse-checkout-cone-mode: false

      - name: Chequear umbrales (fallar si falta la configuración)
        env:
          MONITOR_METRICS_URL: ${{ secrets.MONITOR_METRICS_URL }}
          MONITOR_METRICS_TOKEN: ${{ secrets.MONITOR_METRICS_TOKEN }}
        run: |
          if [ -z "$MONITOR_METRICS_URL" ] || [ -z "$MONITOR_METRICS_TOKEN" ]; then
            echo "::error::Monitoreo SIN CONFIGURAR: faltan MONITOR_METRICS_URL y/o MONITOR_METRICS_TOKEN. No se midió producción (SLA.md §6)."
            {
              echo "## Monitoreo sin configurar"
              echo ""
              echo "Faltan \`MONITOR_METRICS_URL\` y/o \`MONITOR_METRICS_TOKEN\`."
              echo "Sin ellos no se mide nada: la corrida falla para evitar un verde falso."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # El script imprime un JSON auditable y sale ≠0 si algún umbral se
          # viola o el endpoint no responde. Ese ≠0 es el que dispara el correo
          # — pero el informe se publica en el summary TAMBIÉN al fallar, que
          # es justo cuando alguien lo va a leer.
          set +e
          node scripts/ops/check-alerts.mjs 2>&1 | tee informe.json
          CODIGO=${PIPESTATUS[0]}
          set -e
          {
            echo "## Chequeo de umbrales"
            echo ""
            echo '```json'
            cat informe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODIGO"
