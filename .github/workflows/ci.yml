name: CI

# Red de seguridad de valle-design (modelada sobre el ci.yml del monorepo
# origen, recortada a lo que EXISTE en este repo):
#   quality-gates → contrato + licencias + build turbo + typecheck + unit +
#                   Postgres real + lint + specs web + smoke de bootstrap
#   e2e           → full-stack real: next build (prod) + API NestJS real +
#                   next start + Playwright (goldens moqueados en la frontera
#                   de red — así operan en el origen — y e2e/real SIN mocks
#                   contra la API v1 real, incl. hidratación >1MB)
#   gitleaks      → escaneo de secretos del historial completo (.gitleaks.toml)
#   sbom          → CycloneDX + gate de licencias (evidencia de cadena de
#                   suministro; el gate de licencias también corre en
#                   quality-gates porque ahí bloquea el merge)

on:
  pull_request:
    branches: [main]
    # Un cambio que sólo toca prosa no puede romper un gate: no hay contrato,
    # ni tipo, ni spec, ni byte de SDK que dependa de un `.md`. Correr el
    # pipeline entero sobre documentación costó ~150 minutos de runner el 10 de
    # agosto (PR #63, un único archivo Markdown, dos corridas completas) y fue
    # parte de por qué la cuota mensual se agotó a mitad de ciclo.
    #
    # `paths-ignore` NO se aplica al push sobre `main`: ahí sí queremos
    # veredicto de cada commit, cueste lo que cueste, porque es la rama de la
    # que se despliega.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  push:
    branches: [main]
  # Alarma sobre `main` aunque nadie empuje: un fallo intermitente que sólo
  # aparece 1 de cada N corridas no se ve en una foto, se ve en la serie.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # SÓLO se cancelan las corridas de PR, donde el push siguiente sustituye al
  # anterior sobre el MISMO código propuesto.
  #
  # En `main` cancelar era activamente dañino y es la razón de que este repo
  # se quedara rojo sin que nadie lo viera: todos los merges comparten el ref
  # `refs/heads/main`, así que cada fusión mataba la corrida de la fusión
  # anterior. En la serie del 9 de agosto, CINCO commits consecutivos de `main`
  # (792c0603, 99e867d3, 9abe5287, ccffc17c, bfbd26b9) terminaron en
  # «cancelled»: nunca hubo veredicto sobre ellos. Cada commit de `main`
  # merece el suyo, aunque llegue tarde.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Contrato · Build · Test · Lint · Smoke
    runs-on: ubuntu-latest

    # Postgres efímero: las suites *.pg.spec.ts y el smoke de bootstrap deben
    # correr contra Postgres real (tipos jsonb/enum), no SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valle_design_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión de Node sale de .nvmrc (única fuente de verdad).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `cache: npm` de arriba sólo guarda el TARBALL descargado: `npm ci`
      # sigue borrando y reconstruyendo `node_modules` entero, unos dos minutos
      # en cada job y en cada corrida. Cachear el árbol ya instalado, con la
      # clave atada al hash del lockfile, lo deja en segundos.
      #
      # La reproducibilidad no se pierde: si el lockfile cambia un solo byte la
      # clave cambia y se reinstala desde cero con `npm ci`. Un acierto de
      # caché significa, por construcción, el mismo lockfile.
      - name: Restaurar node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (npm ci reproducible)
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # Puerta de CONTRATO: los YAML de packages/contracts/specs validan
      # (el SDK se genera de ahí; un spec roto es un SDK roto).
      - name: Contract lint (Redocly)
        run: npx -y @redocly/cli@1.34.3 lint packages/contracts/specs/design-api.v1.yaml

      - name: CAD contract and legacy-route gates
        run: npm run check:cad

      - name: DWG experimental laboratory gates
        run: npm run check:dwg

      # Puerta de LICENCIAS (misma política del origen): el producto es
      # UNLICENSED; toda dependencia de producción debe ser permisiva.
      - name: Dependency licenses gate
        run: npm run sbom && npm run check:licenses

      # El SBOM ya está generado por el paso de arriba, que es el que BLOQUEA.
      # Antes existía un job `sbom` aparte que repetía checkout + setup + `npm
      # ci` + `npm run sbom` sólo para subir este mismo archivo: ~2,5 minutos de
      # runner por corrida produciendo un artefacto idéntico al que aquí ya
      # está en disco. La evidencia de cadena de suministro no cambia; lo que
      # desaparece es pagarla dos veces.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: valle-design-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Build turbo del monorepo: contracts → design-sdk → api → web.
      - name: Build (turbo)
        run: npx turbo run build

      - name: Typecheck (API)
        working-directory: apps/api
        run: npm run typecheck

      - name: Typecheck (web, incluye specs y e2e)
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests (API)
        working-directory: apps/api
        run: npm test

      # Suites *.pg.spec.ts contra PostgreSQL REAL (REQUIRE_POSTGRES_TESTS:
      # sin base es FALLO, no salto silencioso).
      - name: Postgres tests (API)
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/valle_design_ci
        run: npm run test:pg

      - name: Lint API (bloqueante, sin --fix)
        working-directory: apps/api
        run: npm run lint:check

      # Montón EXPLÍCITO, y no es un capricho: sobre `main` (e41f12d) este paso
      # murió con `FATAL ERROR: Ineffective mark-compacts near heap limit —
      # JavaScript heap out of memory`, exit 134, tras 91 s de GC dando vueltas.
      # No falló ninguna regla: el linter se cayó. Y al caerse arrastró a
      # `skipped` los NUEVE pasos siguientes —`test:specs`, los benchmarks, el
      # journey de aceptación y el smoke de bootstrap—, que por tanto nunca
      # llegaron a correr. Un gate que se muere no dice «hay un error»: deja de
      # decir nada, que es peor.
      #
      # El límite por defecto de Node en el runner son ~2 GB y eslint necesita
      # entre 1,5 y 2 sobre este árbol, así que venía con margen CERO y el
      # veredicto dependía de la suerte. 4 GB da el doble de lo necesario en un
      # runner de 16.
      #
      # Es un tope, no una cura: el coste viene de lintar con tipos un monolito
      # de 23k líneas, y quien lo parta recuperará también este margen.
      #
      # Diagnóstico y medida original: PR #80. Se replica aquí para que este PR
      # no dependa del orden de fusión — los dos tocan este mismo paso y el
      # contenido es idéntico, así que el conflicto se resuelve solo.
      - name: Lint web
        working-directory: apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      # Suites script-style del kernel CAD y la plataforma web (tsx).
      - name: Web specs (tsx)
        working-directory: apps/web
        run: npm run test:specs

      - name: CAD deterministic corpus benchmark (10k + 100k, blocking)
        working-directory: apps/web
        run: npm run benchmark:cad:smoke -- --output ../../cad-benchmark-smoke.json

      # Presupuesto de TIEMPO del pipeline de render, contra la línea base
      # versionada de `render-baseline.json`.
      #
      # Vive AQUÍ y no en «Web specs (tsx)» por lo que demostró #65: el ruido de
      # planificación es absoluto y el coste de este pipeline es pequeño, así
      # que un hipo de 5 ms DUPLICA un número de 6 ms. Dentro del runner de
      # specs —250 specs seguidos, máquina nunca tranquila— eso es un
      # intermitente en la puerta de todo el mundo. Como paso propio, en serie y
      # en su propio proceso, las condiciones son las mismas que las del
      # benchmark de corpus de arriba, que lleva bloqueando desde siempre sin
      # parpadear.
      #
      # El spec `render-gate.spec.ts` sigue en «Web specs», pero sólo con las
      # INVARIANTES —recuentos de entidades, no milisegundos—, que es lo que
      # caza el regreso del muestreo y no puede parpadear.
      # Mismo criterio que la suite de rendimiento del E2E: esto MIDE, no
      # comprueba corrección, y `--repeat 3` son tres pasadas de 100k. Su sitio
      # es `main`, el cron y el disparo manual, que es donde el número tiene
      # significado; en una rama sólo encarece cada push.
      - name: CAD render pipeline budget (100k, blocking)
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: npm run benchmark:cad:render -- --repeat 3 --output ../../cad-benchmark-render.json

      - name: DWG deterministic smoke benchmark
        run: npm run benchmark:smoke --workspace=@valle-design/dwg-codec -- --output "$RUNNER_TEMP/dwg-benchmark-smoke.json"

      - name: Upload DWG benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: dwg-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/dwg-benchmark-smoke.json
          if-no-files-found: error
          retention-days: 90

      # Un INFORME de capacidad a 500k y 1M de entidades. No bloquea nada y no
      # cambia entre un push de rama y el siguiente: es un retrato del motor,
      # no una prueba del cambio propuesto.
      - name: CAD scale capability report (500k + 1M, hardware guarded)
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: npm run benchmark:cad:scale -- --output ../../cad-benchmark-scale.json

      - name: Upload CAD benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: cad-benchmark-${{ github.sha }}
          path: |
            cad-benchmark-smoke.json
            cad-benchmark-scale.json
            cad-benchmark-render.json
          retention-days: 90

      # Test de compatibilidad de contrato del SDK generado vs @valle-design/contracts.
      - name: SDK contract-compat test
        working-directory: packages/design-sdk
        run: npm test

      # El mapa de evidencia del viaje de aceptación CAD (50 pasos) debe
      # apuntar a specs que EXISTEN (mismo checker del origen).
      - name: CAD acceptance journey check
        working-directory: apps/web
        run: npx tsx e2e/golden/cad-acceptance-journey.check.ts

      # Puerta crítica: arranca el grafo DI completo del dist compilado contra
      # Postgres (migraciones + esquema materializado).
      - name: Bootstrap smoke (compilado vs Postgres)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/valle_design_ci
          SYNCHRONIZE: "false"
          MIGRATIONS_RUN: "true"
          IDENTITY_RATE_LIMIT_KEY_SECRET: valle-design-ci-rate-limit-key-32chars
        run: npm run smoke:bootstrap

  e2e:
    name: E2E Playwright ${{ matrix.shard }}/4 (PostgreSQL · Chromium + Firefox)
    runs-on: ubuntu-latest

    # Reparto entre CUATRO máquinas. `playwright.config.ts` fija
    # `workers: 1` y `fullyParallel: false` A PROPÓSITO —los goldens comparten
    # backend y se pisarían—, así que dentro de un job no hay paralelismo que
    # sacar: 56 archivos de spec en serie son ~26 minutos de reloj.
    #
    # `--shard` es otra cosa: reparte los ARCHIVOS entre procesos aislados, y
    # cada uno se lleva su propio Postgres efímero, su propia API y su propio
    # navegador. La serialización dentro de cada shard se conserva intacta.
    #
    # No sale gratis y conviene decirlo: cada shard repite instalación, build y
    # arranque de API, así que el total facturado sube un poco. Se compensa de
    # sobra con la caché de dependencias, y lo que se compra es tiempo de
    # reloj: de ~26 minutos a ~7.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valle_design_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restaurar node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # Los navegadores pesan cientos de megas y no cambian entre corridas: la
      # clave los ata a la versión de Playwright del lockfile.
      - name: Restaurar navegadores de Playwright
        id: browsercache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.event_name == 'pull_request' && 'chromium' || 'both' }}

      # Cobertura ESCALONADA por navegador, y la escala está elegida a partir
      # de los fallos reales de este repo, no por ahorrar sin más:
      #
      #   PR      → Chromium. Los tres intermitentes que costaron un día entero
      #             (goldens 18, 33 y 20) se reprodujeron en Chromium; el
      #             navegador no era la variable.
      #   main    → Chromium + Firefox. Aquí sí importa: Firefox necesita
      #             llvmpipe por X11 y es donde aparecieron dos de los tres
      #             rojos del 9 de agosto. Un commit de `main` sin veredicto de
      #             Firefox no está verificado.
      #
      # Firefox DUPLICA el job (~30 min de runner por corrida). Correrlo en
      # cada push de rama es pagar dos veces por la señal que ya da el otro.
      - name: Seleccionar navegadores
        id: browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=chromium" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "list=chromium firefox" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps ${{ steps.browsers.outputs.list }}

      # WebGL por software para Firefox. El runner no tiene GPU: Chromium cae
      # solo en SwiftShader, pero Firefox agota los drivers
      # (FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS) y se queda SIN viewport, así
      # que las pruebas que dependen de la escena real no medían el producto.
      # La alternativa —excluir Firefox o saltarse esos specs— escondería el
      # problema; darle a Mesa su driver software lo resuelve de verdad.
      # Sólo hace falta cuando corre Firefox: Chromium cae solo en SwiftShader
      # y no toca ni Mesa ni Xvfb. En los PR (Chromium únicamente) este paso
      # era un `apt-get update` + install de seis paquetes para nada.
      - name: Install Mesa software OpenGL (Firefox WebGL)
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          # `eglinfo` en este runner demuestra que llvmpipe está disponible
          # (OpenGL 4.5, Mesa) pero SÓLO en la plataforma surfaceless: GBM,
          # Wayland y X11 fallan `eglInitialize` por no haber servidor gráfico.
          # De ahí Xvfb: con un display real Firefox usa llvmpipe por X11.
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 mesa-utils xvfb
          echo "Renderer disponible:"; (glxinfo -B 2>/dev/null || echo 'glxinfo no disponible')
          (eglinfo -B 2>/dev/null | head -24 || echo 'eglinfo no disponible')

      # El build de producción INLINEA NEXT_PUBLIC_API_URL: debe apuntar al
      # origen de la API real que este job arranca (localhost:4000). Los
      # goldens interceptan ese origen en la frontera de red (herméticos);
      # e2e/real NO intercepta nada.
      - name: Build (turbo, web en modo E2E real)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npx turbo run build

      # API real (R1) contra PostgreSQL 16: mismas migraciones y rutas
      # v1, mismo dominio CAD + blob store + hidratación que producción.
      - name: Start API (NestJS real, PostgreSQL 16 + migrations)
        working-directory: apps/api
        run: |
          nohup node dist/main.js > /tmp/design-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API arriba tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "La API no arrancó; log:"; cat /tmp/design-api.log; exit 1
        env:
          PORT: "4000"
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/valle_design_e2e
          SYNCHRONIZE: "false"
          MIGRATIONS_RUN: "true"
          ALLOWED_ORIGIN: http://localhost:3000
          IDENTITY_TEST_HARNESS: "true"
          IDENTITY_TEST_HARNESS_KEY: valle-design-e2e-harness-key-32-characters-minimum
          IDENTITY_RATE_LIMIT_KEY_SECRET: valle-design-e2e-rate-limit-key-32chars
          AI_MOCK: "1"

      - name: Playwright E2E (goldens + performance + full-stack real)
        working-directory: apps/web
        env:
          E2E_PROD: "1"
          E2E_API_ORIGIN: http://localhost:4000
          E2E_REAL_API: "1"
          E2E_IDENTITY_HARNESS_KEY: valle-design-e2e-harness-key-32-characters-minimum
          # La suite de rendimiento SÓLO fuera de los PR. No es una prueba de
          # corrección: es una medida, y mide lo que ya está en `main`.
          # Su coste está documentado por el propio #75 — `detailReady` 296 s y
          # `zoomSettle` 188 s a 100.000 entidades sin GPU—, o sea ~8 minutos de
          # los ~35 del job, cada vez que alguien empuja una rama.
          #
          # En `main`, en el cron diario y en `workflow_dispatch` sigue corriendo
          # entera y bloqueando: una regresión de rendimiento se detecta en la
          # rama principal y en la serie, que es donde el número significa algo.
          # Quien toque el pipeline de render puede pedirla en su PR con
          # `workflow_dispatch`.
          CAD_PERF_E2E: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          # Fuerza el rasterizador software de Mesa (llvmpipe) para que Firefox
          # obtenga contexto WebGL sin GPU. Chromium no lo necesita y no le
          # afecta: ya usa su propio SwiftShader.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # Firefox headless obtiene su contexto por EGL sin superficie.
          MOZ_ENABLE_WAYLAND: "0"
        # Bajo Xvfb. `eglinfo` en el runner demuestra que llvmpipe SÍ está
        # disponible (OpenGL 4.5, Mesa) pero SÓLO en la plataforma surfaceless:
        # GBM, Wayland y X11 fallan `eglInitialize` porque no hay servidor
        # gráfico. Firefox no toma esa ruta surfaceless y por eso agota los
        # drivers. Darle un display real es la forma canónica de que use
        # llvmpipe por GLX/EGL-X11. Chromium no se ve afectado.
        # Xvfb sólo cuando hay Firefox; con Chromium solo es un envoltorio
        # inútil y un servidor X de más en el runner.
        run: |
          SHARD="--shard=${{ matrix.shard }}/4"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test $SHARD ${{ steps.browsers.outputs.projects }}
          else
            xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test $SHARD
          fi

      # `include-hidden-files` NO es cosmético: sin él este paso nunca subió
      # nada. `.report` y `.test-results` empiezan por punto, y
      # upload-artifact@v4 excluye los ocultos por defecto, así que las tres
      # corridas rojas de `main` del 9 de agosto avisaron
      # «No files were found with the provided path: apps/web/e2e/.report».
      # El informe y las trazas —lo único que explica un fallo intermitente—
      # se descartaban justo cuando hacían falta.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}-shard${{ matrix.shard }}
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.test-results
          include-hidden-files: true
          retention-days: 14

      - name: API log (diagnóstico)
        if: failure()
        run: cat /tmp/design-api.log || true

  gitleaks:
    name: Gitleaks (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binario pineado (sin GITLEAKS_LICENSE): escanea TODO el historial con
      # la config del repo (.gitleaks.toml — allowlist EXACTA del fixture
      # documentado; cualquier hallazgo nuevo rompe el gate).
      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

